      : `<div class="ug-ban idle"><div><b>Bez gry na Nr ${fmt(NX)}<\/b>${cond ? ` · gra w toku: ${cond}` : ''}<\/div>${cfg.idleSub ? `<div class="sub">${esc(cfg.idleSub)}<\/div>` : ''}<\/div>`;
    if (cfg.note) h += `<div class="ug-note">${cfg.note}<\/div>`;
    h += `<div class="ug-hint">Tapnij kartę → tabela modelu · przytrzymaj → wszystkie etykiety<\/div>`;
    let ci = 0; const idx = [];
    cfg.sections.forEach(s => {
      const sb = s.cards.reduce((a, c) => a + c.lines.filter(l => l.p === 1).length, 0);
      const ss = s.cards.reduce((a, c) => a + c.lines.filter(l => l.p === 1).reduce((x, l) => x + (l.stake || 0), 0), 0);
      h += `<div class="ug-sec"><div class="ug-sh"><b>${s.name ? esc(s.name) : `NASTĘPNY WIERSZ Nr ${fmt(NX)}`}<\/b><span class="${sb ? 'g' : 'm'}">${sb ? `GRA ${sb} × · ${fmt(ss)} zł` : 'bez gry'}<\/span><\/div>`;
      s.cards.forEach(c => {
        const top = Math.min(...c.lines.map(l => l.p));
        const shown = c.lines.slice(0, 2), more = c.lines.length - shown.length;
        h += `<div class="ug-mc b${top}" data-c="${ci}"><div class="h"><span class="id">${esc(c.id)}<\/span><span class="rule">${esc(c.rule || '')}<span class="go" data-go="${ci}">› tabela<\/span><\/span><\/div>
          ${shown.map(l => lineHtml(l, false)).join('')}${more > 0 ? `<div class="more">+ ${more} ${more === 1 ? 'etykieta' : more < 5 ? 'etykiety' : 'etykiet'} · przytrzymaj<\/div>` : ''}${metaHtml(c.meta)}<\/div>`;
        idx.push(c); ci++;
      });
      h += `<\/div>`;
    });
    if (cfg.last && cfg.last.length) h += `<div class="ug-last">Ostatnie: ${cfg.last.map(c => `<b>${esc(c)}<\/b>`).join('')}<\/div>`;
    h += `<\/div>`;
    host.innerHTML = h;
    if (cfg.bindTop) cfg.bindTop(host);
    // tapnięcie karty / linii / strzałki → TABELA (linia z Nr → ten wiersz); przytrzymanie karty → okno ze wszystkimi etykietami
    host.querySelectorAll('.ug-mc').forEach(el => {
      const c = idx[+el.dataset.c];
      let t = null, long = false, x0 = 0, y0 = 0;
      const cancel = () => { clearTimeout(t); t = null; el.classList.remove('hold'); };
      el.addEventListener('pointerdown', e => {
        long = false; x0 = e.clientX; y0 = e.clientY; el.classList.add('hold');
        t = setTimeout(() => { long = true; el.classList.remove('hold'); if (navigator.vibrate) navigator.vibrate(25); popup(c); }, 450);
      });
      el.addEventListener('pointermove', e => { if (t && (Math.abs(e.clientX - x0) > 10 || Math.abs(e.clientY - y0) > 10)) cancel(); });
      ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => el.addEventListener(ev, cancel));
      el.addEventListener('contextmenu', e => e.preventDefault());
      el.addEventListener('click', e => {
        if (long) { long = false; e.preventDefault(); return; }
        const st = e.target.closest('.ug-st[data-er]');
        c.go(st ? +st.dataset.er : undefined);
      });
    });
  }
  return { render, popup };
})();


const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmtN = n => n.toLocaleString('pl-PL');
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}

const VALID = new Set(); for (const a of '0123') for (const b of '01') for (const c of '01') VALID.add(a + b + c);
const seedArr = MASTER_SEED.match(/.{3}/g);
let added = [];
(function () { const s = lsGet(LS.added, ''); if (/^(\d{3})*$/.test(s)) for (let i = 0; i < s.length; i += 3) added.push(s.substr(i, 3)); })();
const allCodes = () => seedArr.concat(added);
function saveAdded() { if (!lsSet(LS.added, added.join(''))) alert('BŁĄD zapisu pamięci telefonu — zrób eksport JSON!'); }

// ---- zapis kodów do kluczy każdej tabeli (RAZEM = jedyne źródło prawdy) ----
function writeAppKeys() {
  const all = allCodes();
  for (const a of APPS) {
    if (a.store === 'csv') lsSet(a.key, all.join(','));
    else lsSet(a.key, all.slice(a.seedN).join(''));
    (a.extra || []).forEach(([k, v]) => lsSet(k, v));
  }
}

// ---- ramki ----
const W = k => { const f = $('fr_' + k); return f && f.contentWindow && f.contentWindow.T60; };
let cur = 'gra', homeView = 'gra', ready = 0;
function layout() {
  const h = $('top').offsetHeight;
  $('frames').style.top = h + 'px';
  $('home').style.paddingTop = (h + 10) + 'px';
}
function buildFrames() {
  writeAppKeys();
  for (const a of APPS) {
    const f = document.createElement('iframe');
    f.id = 'fr_' + a.k; f.title = a.name;
    f.addEventListener('load', () => { ready++; if (ready === APPS.length) onReady(); }, { once: true });
    f.srcdoc = a.html;
    $('frames').appendChild(f);
  }
}
function checkSync() {
  const N = allCodes().length, last = allCodes()[N - 1], bad = [];
  for (const a of APPS) { const t = W(a.k); if (!t || t.count() !== N || t.last() !== last) bad.push(a); }
  if (bad.length) { writeAppKeys(); bad.forEach(a => { try { W(a.k).sync(); } catch (e) { console.error(e); } }); }
  return bad.map(a => a.name);
}
function onReady() {
  const bad = checkSync();
  if (bad.length) console.warn('resync', bad);
  renderChips(); show(cur);
}

// ---- nawigacja ----
function renderChips() {
  const L = gatherLines();
  $('chips').innerHTML = [['gra', 'GRA'], ...APPS.map(a => [a.k, a.short]), ['dane', 'DANE']].map(([k, t]) => {
    const n = (L.find(x => x.a.k === k) || {}).bets || 0;
    return `<button data-k="${k}" class="${k === cur ? 'on' : ''}">${t}${n ? `<i>${n}</i>` : ''}</button>`;
  }).join('');
  $('chips').querySelectorAll('button').forEach(b => b.onclick = () => show(b.dataset.k));
  $('hdrN').innerHTML = `n=${fmtN(allCodes().length)}${added.length ? `<br>+${added.length}` : ''}`;
  renderHint(L);
}
function show(k) {
  cur = k;
  $('chips').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.k === k));
  const isApp = APPS.some(a => a.k === k);
  document.querySelectorAll('#frames iframe').forEach(f => f.classList.toggle('on', f.id === 'fr_' + k));
  $('frames').style.display = isApp ? '' : 'none';
  $('home').style.display = isApp ? 'none' : '';
  layout();
  if (isApp) { try { W(k).render(); } catch (e) {} }
  else { homeView = k; renderHome(); window.scrollTo(0, 0); }
}
function goModel(ak, id, er) {
  show(ak);
  setTimeout(() => { try { W(ak).go(id, er); } catch (e) { console.error(e); } }, 30);
  if (navigator.vibrate) navigator.vibrate(10);
}

// ---- zbiorczy ekran GRA ----
function gatherLines() {
  return APPS.map(a => {
    let r = { sections: [], trig: [] };
    try { r = W(a.k).lines(); } catch (e) {}
    const items = [].concat(...r.sections.map(s => s.items));
    const p1 = items.filter(x => x.p === 1);
    return { a, r, bets: p1.length, stake: p1.reduce((s, x) => s + (x.stake || 0), 0), cond: items.filter(x => x.p === 2).length };
  });
}
function lineHtml(ak, x) {
  const more = (x.more || []).map(m => `<span class="m">+ ${esc(m.txt)}</span>`).join('');
  return `<div class="nxl p${x.p}" data-a="${ak}" data-id="${esc(x.id)}" data-er="${x.er || ''}"><b class="id">${esc(x.id)}</b><span class="t">${esc(x.txt)}<span class="go">›</span></span>${x.sub ? `<span class="s">${esc(x.sub)}</span>` : ''}${more}</div>`;
}
function renderHint(L) {
  const m = new Map();
  L.forEach(({ a, r }) => (r.trig || []).forEach(([c, ids]) => { if (!m.has(c)) m.set(c, []); m.get(c).push(`${a.short}:${ids.join(',')}`); }));
  $('hint').innerHTML = m.size ? 'TRIGGER da: ' + [...m].map(([c, l]) => `<b>${c}</b> → ${esc(l.join(' '))}`).join(' · ') : 'Żaden kod w następnym wierszu nie da teraz triggera.';
}
function renderGraHome() {
  const sections = [];
  let note = '';
  APPS.forEach(a => {
    let secs = [];
    try { secs = W(a.k).cards((id, er) => goModel(a.k, id, er)); } catch (e) { console.error(e); }
    secs.forEach(sc => sections.push({ name: sc.name && sc.name !== a.name ? `${a.short} · ${sc.name}` : a.name, cards: sc.cards }));
    if (a.k === 'trojka') { try { note = '<b>TRÓJKA</b> · ' + W(a.k).note(); } catch (e) {} }
  });
  UG.render($('home'), { N: allCodes().length, sections, note, last: allCodes().slice(-8), idleSub: 'Żadna tabela nie gra na następnym wierszu.' });
}
function renderHome() { if (homeView === 'dane') renderDane(); else renderGraHome(); }
function refresh() { renderChips(); if (!APPS.some(a => a.k === cur)) renderHome(); }

// ---- wpis / cofnij ----
let toastT = null;
function toast(html, ms = 3500) {
  const t = $('toast'); t.innerHTML = html; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), ms);
}
$('toast').onclick = () => $('toast').classList.remove('on');
function addCode(c) {
  added.push(c); saveAdded();
  const N = allCodes().length, parts = [];
  for (const a of APPS) {
    let m = '';
    try { m = W(a.k).add(c) || ''; } catch (e) { console.error(e); }
    m = m.replace(/^Nr \d+: <b>\d{3}<\/b>(<br>)?/, '').trim();
    if (m) parts.push(`<div class="ap">${a.short}</div>${m}`);
  }
  const bad = checkSync();
  refresh();
  const L = gatherLines(), bets = L.reduce((s, x) => s + x.bets, 0), stake = L.reduce((s, x) => s + x.stake, 0);
  const nxt = bets ? `<div class="ap" style="color:#fff;background:#FF6600;border-radius:6px;padding:4px 6px">▼ NASTĘPNY KOD = GRA: ${L.filter(x => x.bets).map(x => `${x.a.short} ${x.bets}×`).join(' · ')} · ${fmtN(stake)} zł</div>` : '';
  toast(`Nr ${fmtN(N)}: <b>${c}</b>${nxt}${parts.join('')}${bad.length ? `<div class="er">Ponowne przeliczenie: ${bad.join(', ')}</div>` : ''}`, bets ? 7000 : 4500);
  if (navigator.vibrate) navigator.vibrate(bets ? [60, 60, 120] : 25);
  if (lsGet(LS.autobk, '1') === '1' && added.length % 10 === 0) exportJSON(true);
}
function undo() {
  if (!added.length) { toast('Brak dopisanych kodów do cofnięcia (kody z pliku są chronione).'); return; }
  const N = allCodes().length, c = added[added.length - 1];
  if (!confirm(`Cofnąć Nr ${N}: ${c}?\n(cofa we wszystkich tabelach)`)) return;
  added.pop(); saveAdded();
  for (const a of APPS) { try { W(a.k).undo(); } catch (e) { console.error(e); } }
  checkSync(); refresh();
  toast(`Cofnięto Nr ${fmtN(N)}: ${c}`);
}
function submitCode() {
  const inp = $('codeIn'), v = inp.value.trim();
  if (!v) return;
  if (!VALID.has(v)) {
    inp.classList.remove('bad'); void inp.offsetWidth; inp.classList.add('bad');
    toast(`„${esc(v)}” to nie jest kod z ciągu (1. cyfra 0–3, 2. i 3. cyfra 0–1).`);
    inp.select(); return;
  }
  inp.value = ''; inp.classList.remove('bad');
  addCode(v);
  inp.focus();
}
$('codeIn').addEventListener('input', () => {
  const inp = $('codeIn'); inp.value = inp.value.replace(/\D/g, '').slice(0, 3); inp.classList.remove('bad');
  if (inp.value.length === 3) submitCode();
});
$('codeIn').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); submitCode(); } });
$('addBtn').onclick = submitCode;
$('undoBtn').onclick = () => { undo(); $('codeIn').focus(); };

// ---- DANE: eksport (format Pikoff), import, test ----
function stamp() { const d = new Date(), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`; }
function exportJSON(auto) {
  const codes = allCodes();
  const name = `xx1_pikoff_${stamp()}_n${codes.length}.json`;
  const payload = { kind: 'xx1_pikoff', app: 'T60 RAZEM', version: APP_VER, table: 'Tabela60off5678',
    created: new Date().toISOString(), n: codes.length, seed_n: PIKOFF_SEED_N, codes };
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(payload, null, 1)], { type: 'application/json' }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  lsSet(LS.lastbk, `${new Date().toLocaleString('pl-PL')} · n=${codes.length}`);
  toast(auto ? `Auto-kopia: ${name}` : `Zapisano ${name}`);
  if (homeView === 'dane' && cur === 'dane') renderDane();
}
function importFile(d, fname) {
  const raw = Array.isArray(d) ? d : d && d.codes;
  if (!Array.isArray(raw)) throw new Error('w pliku nie ma listy kodów (codes)');
  const arr = raw.map(x => String(x == null ? '' : x).trim().padStart(3, '0'));
  const badI = arr.findIndex(c => !VALID.has(c));
  if (badI >= 0) throw new Error(`niepoprawny kod „${arr[badI]}” w Nr ${badI + 1}`);
  const all = allCodes(), n = Math.min(arr.length, all.length);
  for (let i = 0; i < n; i++) if (arr[i] !== all[i])
    throw new Error(`różnica w Nr ${i + 1}: plik ${arr[i]}, aplikacja ${all[i]}. Nic nie zmieniono.`);
  if (arr.length <= all.length) { alert(`Plik ${fname} (${arr.length} kodów, ${d.kind || 'bez kind'}) jest zgodny, ale nie ma nowych kodów.\nAplikacja ma ${all.length}. Nic nie zmieniono.`); return; }
  const gain = arr.length - all.length;
  if (!confirm(`Import ${fname}\nrodzaj: ${d.kind || '—'} · ${arr.length} kodów\nzgodny z aplikacją w Nr 1–${all.length}\n\nDopisać ${gain} nowych kodów do WSZYSTKICH tabel?`)) return;
  added = arr.slice(SEED_N); saveAdded(); writeAppKeys();
  for (const a of APPS) { try { W(a.k).sync(); } catch (e) { console.error(e); } }
  checkSync();
  lsSet(LS.lastimp, `${d.kind || 'plik'} · ${new Date().toLocaleString('pl-PL')} · n=${arr.length} · +${gain}`);
  refresh(); toast(`Zaimportowano +${gain} kodów, teraz n=${fmtN(allCodes().length)}`, 5000);
}
$('fileIn').onchange = e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => { try { importFile(JSON.parse(rd.result), f.name); } catch (err) { alert('Import przerwany, nic nie zmieniono:\n' + err.message); } };
  rd.readAsText(f);
};
let testOut = '';
function renderDane() {
  const auto = lsGet(LS.autobk, '1') === '1';
  $('home').innerHTML = `<div class="card"><h2>Dane</h2><table class="stt"><tbody>
    <tr><td>Kody razem</td><td>${fmtN(allCodes().length)}</td></tr>
    <tr><td>Seed (Test60, KODY)</td><td>${fmtN(SEED_N)}</td></tr>
    <tr><td>Dopisane w aplikacji</td><td>${fmtN(added.length)}</td></tr>
    <tr><td>Ostatni import</td><td>${esc(lsGet(LS.lastimp, '—'))}</td></tr>
    <tr><td>Ostatnia kopia</td><td>${esc(lsGet(LS.lastbk, '—'))}</td></tr>
    <tr><td>Wersja</td><td>${APP_VER}</td></tr></tbody></table>
    <div class="row"><button class="btn pri" id="exp">⬇ Eksport JSON (Pikoff)</button><button class="btn" id="imp">⬆ Import JSON</button></div>
    <label class="sw"><input type="checkbox" id="auto" ${auto ? 'checked' : ''}> Auto-kopia co 10 kodów</label>
    <div class="small">Eksport ma format Pikoff 60: plik <b>xx1_pikoff_RRRRMMDD_HHMM_nN.json</b>, <b>kind: xx1_pikoff</b>, pełny ciąg od Nr 1. Na PC jak dotąd: <b>apka_pikoff_do_wszystkich_60.py</b>.<br>
    Import przyjmuje JSON z każdej starej aplikacji Test60 (Pikoff, TOP5, TOP7, BUST, TRÓJKA). Jeśli ciąg różni się choć w jednym wierszu, import się zatrzymuje i nic nie zmienia.</div></div>
  <div class="card"><h2>Test zgodności silników</h2><div class="row"><button class="btn" id="tst">Uruchom test (seed)</button></div><div id="tout">${testOut}</div></div>
  <div class="card"><h2>Tabele w aplikacji</h2><table class="stt"><tbody>${APPS.map(a => `<tr><td>${a.name}</td><td>${a.ver}</td></tr>`).join('')}</tbody></table>
    <div class="row"><button class="btn warn" id="rst">Usuń dopisane kody</button></div></div>`;
  $('exp').onclick = () => exportJSON(false);
  $('imp').onclick = () => $('fileIn').click();
  $('auto').onchange = e => lsSet(LS.autobk, e.target.checked ? '1' : '0');
  $('tst').onclick = () => {
    $('tout').innerHTML = '<div class="small">liczę…</div>';
    setTimeout(() => {
      testOut = APPS.map(a => { let r; try { r = W(a.k).selfTest(); } catch (e) { r = { ok: false, txt: e.message }; } return `<div class="${r.ok ? 'ok' : 'er'}">${r.ok ? '✓' : '✗'} <b>${a.short}</b> · ${esc(r.txt)}</div>`; }).join('');
      $('tout').innerHTML = testOut;
    }, 30);
  };
  $('rst').onclick = () => {
    if (!added.length) return toast('Nie ma dopisanych kodów.');
    if (!confirm(`Usunąć ${added.length} dopisanych kodów ze WSZYSTKICH tabel?`)) return;
    if (!confirm('Na pewno? Zrób najpierw eksport JSON.')) return;
    added = []; saveAdded(); writeAppKeys();
    for (const a of APPS) { try { W(a.k).sync(); } catch (e) {} }
    refresh(); toast('Usunięto dopisane kody.');
  };
}

window.addEventListener('resize', layout);
layout();
buildFrames();
</script>
