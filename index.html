}\n.ug-st.p3{background:#DEEBF7;color:#1F4E78}\n.ug-st.p4{background:#7030A0;color:#fff}\n.ug-st.p5{background:#1b1f2a;color:#ffc896;font-weight:600}\n.ug-st.p6{background:#1b1f2a;color:#8b93a7;font-weight:500}\n.ug-mc .more{margin-top:4px;font-size:11.5px;color:#9fc4ff;font-weight:600}\n.ug-mc .meta{margin-top:5px;color:#8b93a7;font-size:12px;display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}\n.ug-mc .meta .pos{color:#5fd38a;font-weight:700}.ug-mc .meta .neg{color:#ff8a8a;font-weight:700}\n.ug-last{display:flex;gap:5px;flex-wrap:wrap;margin:6px 2px 10px;color:#8b93a7;font-size:12px;align-items:center}\n.ug-last b{color:#e8ebf2;background:#242a38;border-radius:5px;padding:2px 6px;font-variant-numeric:tabular-nums}\n.ug-pop{position:fixed;inset:0;z-index:300;background:#000a;display:flex;align-items:flex-end}\n.ug-pop .sh{width:100%;max-height:80vh;overflow:auto;background:#1b1f2a;border-top:2px solid #ff6600;border-radius:14px 14px 0 0;padding:12px 14px 22px;color:#e8ebf2;font:14px/1.4 system-ui,sans-serif}\n.ug-pop h3{margin:0 0 2px;font-size:17px}.ug-pop .hs{color:#8b93a7;font-size:12px;margin-bottom:8px}\n.ug-pop .x{float:right;background:#242a38;border:1px solid #323a4d;color:#e8ebf2;border-radius:8px;padding:4px 10px;font-size:15px}\n.ug-pop .ug-st{cursor:default}.ug-pop .ug-st.j{cursor:pointer}\n.ug-pop .ug-st .jr{float:right;font-size:11px;opacity:.85}\n.ug-pop .meta{color:#8b93a7;font-size:12.5px;margin-top:10px;display:flex;justify-content:space-between}\n.ug-pop .gobtn{margin-top:12px;width:100%;padding:11px;border-radius:9px;border:0;background:#ff6600;color:#fff;font-weight:700;font-size:15px}`;\n  const st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);\n\n  const lineHtml = (l, pop) => `<div class=\"ug-st p${l.p}${pop && l.er ? ' j' : ''}\"${l.er ? ` data-er=\"${l.er}\"` : ''}>${pop && l.er ? `<span class=\"jr\">Nr ${l.er} ›<\/span>` : ''}${esc(l.txt)}${l.sub ? `<span class=\"s\">${esc(l.sub)}<\/span>` : ''}<\/div>`;\n  const metaHtml = m => m ? `<div class=\"meta\"><span>${esc(m[0])}<\/span><span class=\"${/^\\+/.test(m[1]) ? 'pos' : /^[−-]/.test(m[1]) ? 'neg' : ''}\">${esc(m[1])}<\/span><\/div>` : '';\n\n  function popup(c) {\n    const p = document.createElement('div'); p.className = 'ug-pop';\n    p.innerHTML = `<div class=\"sh\"><button class=\"x\">✕<\/button><h3>${esc(c.id)}<\/h3><div class=\"hs\">${esc(c.rule || '')}<\/div>\n      ${c.lines.map(l => lineHtml(l, true)).join('')}${metaHtml(c.meta)}<button class=\"gobtn\">› TABELA ${esc(c.id)}<\/button><\/div>`;\n    p.onclick = e => { if (e.target === p || e.target.classList.contains('x')) p.remove(); };\n    p.querySelector('.gobtn').onclick = () => { p.remove(); c.go(); };\n    p.querySelectorAll('.ug-st.j').forEach(el => el.onclick = () => { p.remove(); c.go(+el.dataset.er); });\n    document.body.appendChild(p);\n  }\n\n  // kolejność: w karcie linie wg pilności; karty i sekcje — najpierw GRA na następnym wierszu\n  const topP = c => Math.min(...c.lines.map(l => l.p));\n  function order(sections) {\n    sections.forEach(s => {\n      s.cards.forEach(c => { c.lines = c.lines.map((l, i) => [l, i]).sort((a, b) => a[0].p - b[0].p || a[1] - b[1]).map(x => x[0]); });\n      s.cards = s.cards.map((c, i) => [c, i]).sort((a, b) => topP(a[0]) - topP(b[0]) || a[1] - b[1]).map(x => x[0]);\n    });\n    return sections.map((s, i) => [s, i]).sort((a, b) => {\n      const pa = a[0].cards.length ? topP(a[0].cards[0]) : 9, pb = b[0].cards.length ? topP(b[0].cards[0]) : 9;\n      return (pa === 1 ? 0 : 1) - (pb === 1 ? 0 : 1) || a[1] - b[1];\n    }).map(x => x[0]);\n  }\n  function render(host, cfg) {\n    cfg.sections = order(cfg.sections);\n    const all = [].concat(...cfg.sections.map(s => s.cards));\n    const bets = [];\n    all.forEach(c => c.lines.forEach(l => { if (l.p === 1) bets.push({ id: c.id, l }); }));\n    const sum = bets.reduce((a, b) => a + (b.l.stake || 0), 0);\n    const cond = all.filter(c => c.lines.some(l => l.p === 2)).length;\n    const NX = cfg.N + 1, fmt = n => n.toLocaleString('pl-PL');\n    let h = `<div class=\"ug\">${cfg.top || ''}`;\n    h += bets.length\n      ? `<div class=\"ug-ban bet\"><div class=\"big\">▼ NASTĘPNY WIERSZ Nr ${fmt(NX)} = GRA<\/div><div class=\"sub\">${bets.length} × · razem ${fmt(sum)} zł · ${bets.map(b => esc(b.id)).join(' · ')}<\/div><\/div>`\n      : `<div class=\"ug-ban idle\"><div><b>Bez gry na Nr ${fmt(NX)}<\/b>${cond ? ` · gra w toku: ${cond}` : ''}<\/div>${cfg.idleSub ? `<div class=\"sub\">${esc(cfg.idleSub)}<\/div>` : ''}<\/div>`;\n    if (cfg.note) h += `<div class=\"ug-note\">${cfg.note}<\/div>`;\n    h += `<div class=\"ug-hint\">Tapnij kartę → tabela modelu · przytrzymaj → wszystkie etykiety<\/div>`;\n    let ci = 0; const idx = [];\n    cfg.sections.forEach(s => {\n      const sb = s.cards.reduce((a, c) => a + c.lines.filter(l => l.p === 1).length, 0);\n      const ss = s.cards.reduce((a, c) => a + c.lines.filter(l => l.p === 1).reduce((x, l) => x + (l.stake || 0), 0), 0);\n      h += `<div class=\"ug-sec\"><div class=\"ug-sh\"><b>${s.name ? esc(s.name) : `NASTĘPNY WIERSZ Nr ${fmt(NX)}`}<\/b><span class=\"${sb ? 'g' : 'm'}\">${sb ? `GRA ${sb} × · ${fmt(ss)} zł` : 'bez gry'}<\/span><\/div>`;\n      s.cards.forEach(c => {\n        const top = Math.min(...c.lines.map(l => l.p));\n        const shown = c.lines.slice(0, 2), more = c.lines.length - shown.length;\n        h += `<div class=\"ug-mc b${top}\" data-c=\"${ci}\"><div class=\"h\"><span class=\"id\">${esc(c.id)}<\/span><span class=\"rule\">${esc(c.rule || '')}<span class=\"go\" data-go=\"${ci}\">› tabela<\/span><\/span><\/div>\n          ${shown.map(l => lineHtml(l, false)).join('')}${more > 0 ? `<div class=\"more\">+ ${more} ${more === 1 ? 'etykieta' : more < 5 ? 'etykiety' : 'etykiet'} · przytrzymaj<\/div>` : ''}${metaHtml(c.meta)}<\/div>`;\n        idx.push(c); ci++;\n      });\n      h += `<\/div>`;\n    });\n    if (cfg.last && cfg.last.length) h += `<div class=\"ug-last\">Ostatnie: ${cfg.last.map(c => `<b>${esc(c)}<\/b>`).join('')}<\/div>`;\n    h += `<\/div>`;\n    host.innerHTML = h;\n    if (cfg.bindTop) cfg.bindTop(host);\n    // tapnięcie karty / linii / strzałki → TABELA (linia z Nr → ten wiersz); przytrzymanie karty → okno ze wszystkimi etykietami\n    host.querySelectorAll('.ug-mc').forEach(el => {\n      const c = idx[+el.dataset.c];\n      let t = null, long = false, x0 = 0, y0 = 0;\n      const cancel = () => { clearTimeout(t); t = null; el.classList.remove('hold'); };\n      el.addEventListener('pointerdown', e => {\n        long = false; x0 = e.clientX; y0 = e.clientY; el.classList.add('hold');\n        t = setTimeout(() => { long = true; el.classList.remove('hold'); if (navigator.vibrate) navigator.vibrate(25); popup(c); }, 450);\n      });\n      el.addEventListener('pointermove', e => { if (t && (Math.abs(e.clientX - x0) > 10 || Math.abs(e.clientY - y0) > 10)) cancel(); });\n      ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => el.addEventListener(ev, cancel));\n      el.addEventListener('contextmenu', e => e.preventDefault());\n      el.addEventListener('click', e => {\n        if (long) { long = false; e.preventDefault(); return; }\n        const st = e.target.closest('.ug-st[data-er]');\n        c.go(st ? +st.dataset.er : undefined);\n      });\n    });\n  }\n  return { render, popup };\n})();\n<\/script>\n<script>// ===== T60 RAZEM — nakładka TOP5 / TOP7 =====\n(function () {\n  lsSet(LS_AUTOBK, '0');                       // autokopię robi RAZEM (format Pikoff)\n  const $t = () => document.getElementById('toast');\n\n  function sync() {\n    added.length = 0;\n    const s = lsGet(LS_ADDED, '');\n    if (/^(\\d{3})*$/.test(s)) for (let i = 0; i < s.length; i += 3) added.push(s.substr(i, 3));\n    recompute(); render();\n  }\n  function add(c) { $t().innerHTML = ''; addCode(c); return $t().innerHTML; }\n  function undo1() { window.__t60auto = true; try { undo(); } finally { window.__t60auto = false; } }\n\n  // NASTĘPNY WIERSZ — ta sama logika co renderGra tej apki (1 linia na model)\n  function lines() {\n    const NX = codes.length + 1;\n    const items = results.map(({ model: m, res, live }) => {\n      const p = res.pending;\n      if (p && p.betIn === 1)\n        return { id: m.id, p: 1, key: 'NEXT_BET', k: p.k, stake: STAWKI[p.k], txt: `▼ GRA ${m.betLabel} · K${p.k} · ${STAWKI[p.k]} zł`, sub: `trigger Nr ${p.trigI + 1} (+${m.off})` };\n      if (p)\n        return { id: m.id, p: 4, key: 'TRIG_PEND', txt: `gra za ${p.betIn} → Nr ${p.trigI + m.off + 1} · K${p.k}`, sub: `trigger Nr ${p.trigI + 1}` };\n      if (res.state === 'open')\n        return { id: m.id, p: 3, key: 'czek', txt: `trigger jeśli wpadnie ${m.trigLabel}`, sub: `→ gra na Nr ${NX + m.off} · K${res.nextK}` };\n      if (live.type === 'COUNTING')\n        return { id: m.id, p: 6, key: 'wait', txt: `brak · HIT ${live.hits}/${m.min}`, sub: m.stepLabel };\n      return { id: m.id, p: 6, key: 'wait', txt: 'brak · czeka na STEP', sub: `${m.min}× ${m.stepLabel}` };\n    });\n    const openM = results.filter(x => x.res.state === 'open');\n    const trig = CODES16.map(c => [c, openM.filter(x => match(c, x.model.trig)).map(x => x.model.id)]).filter(x => x[1].length);\n    return { sections: [{ name: '', items }], trig };\n  }\n\n  // ===== TABELA w układzie wspólnym (UT) — etykiety 1:1 z rowView / playPlan =====\n  const css = k => sty(k);\n  const A = {\n    N: () => codes.length, code: i => codes[i], isNew: i => i >= SEED_N,\n    models: () => MODELS.map(m => ({ id: m.id })),\n    desc: mi => { const m = MODELS[mi]; return esc(`${m.id}: ${m.min}× ${m.stepLabel} → trigger ${m.trigLabel} → BET ${m.betLabel} na +${m.off} · K8`); },\n    descTxt: mi => { const m = MODELS[mi]; return `${m.min}× ${m.stepLabel} → trigger ${m.trigLabel} → BET ${m.betLabel} na +${m.off} · K8`; },\n    last: mi => { const r = results[mi]; return r.res.pending ? r.res.pending.trigI + r.model.off : codes.length - 1; },\n    cell: (mi, i) => {\n      const P = getPlans(), m = MODELS[mi], res = results[mi].res, pe = P[mi].get(i), out = { det: [] };\n      if (pe) {\n        out.gra = { t: pe.t, css: css(pe.st) };\n        out.det.push(['Trigger', `Nr ${pe.trigI + 1} (+${m.off})`], ['Zakład', `Nr ${pe.betI + 1} · K${pe.k} · ${STAWKI[pe.k]} zł`]);\n      }\n      if (i < codes.length) {\n        const v = rowView(m, res.rows[i]);\n        out.stan = { t: v.rola, css: css(v.styleKey), sub: [v.num, v.para, v.krok].filter(x => x != null && x !== '').join(' · ') };\n        if (v.num != null) out.det.push(['#', v.num]);\n        if (v.para != null) out.det.push(['Para', v.para]);\n        if (v.krok != null) out.det.push(['Krok', v.krok]);\n      }\n      return out;\n    },\n    ev: (mi, i) => { const c = A.cell(mi, i); return !!c.gra || (c.stan && !/^(wait|STEP skip)$/.test(c.stan.t)); },\n    tag: (mi, i) => {\n      const P = getPlans(), pe = P[mi].get(i);\n      if (i >= codes.length) return pe ? { t: pe.tag, css: css(pe.st) } : null;\n      const s = shortTag(results[mi].res.rows[i], pe); return { t: s.tag, css: css(s.st) };\n    },\n    chip: (mi, i) => {\n      const p = getPlans()[mi].get(i);\n      if (!p || !(p.st === 'NEXT_BET' || p.st === 'TRIG_PEND' || p.st === 'BET_WIN' || p.st === 'BET_LOSS')) return null;\n      return { css: css(p.st), t: p.st === 'TRIG_PEND' ? `▶ gra Nr ${p.betI + 1}` : p.st === 'NEXT_BET' ? (p.betI === i ? `GRA K${p.k} ${STAWKI[p.k]} zł` : `▼ nast. GRA K${p.k}`) : `${p.tag === 'W' ? 'WIN' : 'LOSS'} K${p.k}` };\n    },\n    legend: () => `Kolumna <b>GRA<\/b>: <span style=\"${css('TRIG_PEND')}\">▶ TRIGGER → start gry<\/span><span style=\"${css('czek')}\">start gry za n<\/span><span style=\"${css('NEXT_BET')}\">▼ następny wiersz = GRA<\/span><span style=\"${css('BET_WIN')}\">WIN<\/span><span style=\"${css('BET_LOSS')}\">LOSS<\/span>\n      <br><b>Stan/Rola<\/b>: <span style=\"${css('HIT')}\">HIT n<\/span><span style=\"${css('OPEN')}\">STEP OPEN<\/span><span style=\"${css('skip')}\">skip<\/span><span style=\"${css('RESET')}\">RESET<\/span><span style=\"${css('czek')}\">czekamy (off)<\/span><span style=\"${css('TRIG_WIN')}\">TRIGGER → WIN<\/span><span style=\"${css('TRIG_LOSS')}\">TRIGGER → LOSS<\/span><span style=\"${css('BET_WIN')}\">BET WIN<\/span><span style=\"${css('BET_LOSS')}\">BET LOSS<\/span>\n      <br>WSZ: T trigger · liczba = za ile wierszy · ▼ następny = gra · W/L wynik · H1 HIT · OP STEP OPEN · s skip · R RESET · · wait. Wiersze przerywane = przyszłe kody gry w toku.`,\n    bottomH: () => document.querySelector('nav').offsetHeight,\n  };\n  UT.A = A;\n  renderTab = function () { UT.render($main, A); };\n\n  // TAPNIĘCIE → TABELA modelu, wiersz którego dotyczy stan: gra w toku → TRIGGER, inaczej ostatni\n  function goModel(id) {\n    const mi = MODELS.findIndex(m => m.id === id);\n    if (mi < 0) return;\n    const r = results[mi].res;\n    UT.open(id, r.pending ? r.pending.trigI : null);\n    view = 'tab'; render();\n  }\n  // ===== GRA w układzie wspólnym (UG, wzór PIKOFF) =====\n  let STr = null, ST = null;\n  const stat = mi => { if (STr !== results) { STr = results; ST = results.map(x => computeStats(codes, x.res, x.model)); } return ST[mi]; };\n  const zl = v => `${v >= 0 ? '+' : '−'}${Math.abs(v).toLocaleString('pl-PL')} zł`;\n  function cards(goFn) {\n    const L = lines().sections[0].items;\n    return [{ name: '', cards: results.map((x, mi) => {\n      const m = x.model, l = L[mi], st = stat(mi);\n      return { id: m.id, rule: `${m.min}× ${m.stepLabel} → ${m.trigLabel} · +${m.off}`,\n        lines: [{ p: l.p, txt: l.txt, sub: l.sub, stake: l.stake }],\n        meta: [`trig ${st.trig} · WIN ${st.win} · WR ${st.wr}% · busty ${st.busty}`, zl(st.bilans)],\n        go: er => goFn(m.id, er) };\n    }) }];\n  }\n  const _rg = renderGra;\n  renderGra = function () {\n    _rg();   // podpowiedź „TRIGGER da” pod polem\n    UG.render($main, { N: codes.length, sections: cards(id => goModel(id)), last button><\/div>\n  <div class=\"ehint\" id=\"eHint\"><\/div><\/div>\n<main id=\"main\"><\/main>\n<div class=\"toast\" id=\"toast\"><\/div>\n<nav>\n  <button data-v=\"gra\" class=\"on\">GRA<\/button>\n  <button data-v=\"tab\">TABELA<\/button>\n  <button data-v=\"stat\">STATY<\/button>\n  <button data-v=\"dane\">DANE<\/button>\n<\/nav>\n<input type=\"file\" id=\"fileIn\" accept=\".json,application/json\">\n<script>\n/* =====================================================================\n * SILNIK test60 xx1 012BUST — 12 modeli STEP → TRIGGER → ZAKŁAD (xx1, K8)\n * Wersja: 1.0 (2026-09-27) · JavaScript ES2019, zero zależności\n * Działa: przeglądarka / PWA / Capacitor / React Native / Node.\n *\n * Silnik referencyjny = test60_xx1_012bust_rules.py (Python). Ten plik daje\n * IDENTYCZNE etykiety i bilans (walidacja zero-diff: 12 837 wierszy × 12 modeli\n * względem test60xx1012BUST.xlsx, arkusze CIAG_0/1/2_BUST) + statystyki jak\n * w arkuszu STATYSTYKI + tryb LIVE (\"co zrobić przy następnym kodzie\").\n *\n * ---------------------------------------------------------------------\n * 1. ZAPIS WZORCÓW\n * ---------------------------------------------------------------------\n *  kod = 3 cyfry (np. '012'). 'x' = dowolna cyfra, 'a∪b' = dowolny z,\n *  'a → b' = dwa KOLEJNE wiersze (wiersz i-1 ∈ a, wiersz i ∈ b).\n *  Kod uszkodzony (np. 'XXX') nie pasuje do niczego (przerywa serię/układ);\n *  na wierszu zakładu = ZWROT (krok i bilans bez zmian, zakład nie liczony)\n *  [założenie — w ciągu referencyjnym brak XXX].\n *\n * ---------------------------------------------------------------------\n * 2. FSM JEDNEGO MODELU\n * ---------------------------------------------------------------------\n *  S  CZEKAM NA STEP\n *     SERIA ×n : n kolejnych wierszy z zestawu. Etykiety \"step j/n\" (j<n),\n *                n-ty wiersz \"STEP\". Licznik liczy od wiersza zakład+1.\n *     UKŁAD a→b: wiersz i-1 ∈ a i wiersz i ∈ b → \"STEP\" na wierszu i.\n *                Wiersz a MOŻE by     if (b >= N) {\n        if (withLabels) lab[i] = `TRIGGER → k${k + 1} ${st} zł na w.${b + 1} (nierozegrany)`;\n        pending = { stepRow, trigRow: i, betRow: b };\n        state = 'P';\n        break;\n      }\n      if (withLabels) {\n        lab[i] = `TRIGGER → k${k + 1} ${st} zł na w.${b + 1}`;\n        for (let j = 1; j < off; j++) lab[i + j] = j === off - 1 ? `GRA NA NASTĘPNYM WIERSZU: k${k + 1} ${st} zł` : `przed grą ${off - j}`;\n      }\n      const cb = codes[b];\n      let res, txt, kk = k;\n      if (!isValid(cb)) {\n        res = 'ZWROT'; txt = `k${k + 1} ${st} zł ZWROT (${cb})`;\n      } else if (cb[2] === '1') {\n        const p = winProfit(k + 1); bal += p; res = 'WIN'; txt = `k${k + 1} ${st} zł WIN +${p}`; k = 0;\n      } else if (k === kLimit - 1) {\n        bal -= cum(kLimit); res = 'BUST'; txt = `k${k + 1} ${st} zł BUST -${cum(kLimit)}`; k = 0;\n      } else {\n        res = 'LOSS'; txt = `k${k + 1} ${st} zł przegrana`; k += 1;\n      }\n      if (withLabels) { lab[b] = txt; bil[b] = bal; }\n      bets.push({ stepRow, trigRow: i, betRow: b, k: kk + 1, stake: st, res, bal });\n      i = b + 1; state = 'S'; run = 0;\n    }\n    return { m, labels: lab, bilans: bil, bets, state, k, bal, stepRow, pending, run, N };\n  }\n\n  function modelStats(s) {\n    const bets = s.bets.filter((b) => b.res !== 'ZWROT');\n    const cyc = []; let cur = [];\n    for (const b of bets) { cur.push(b); if (b.res === 'WIN' || b.res === 'BUST') { cyc.push(cur); cur = []; } }\n    const win = bets.filter((b) => b.res === 'WIN').length;\n    const bust = bets.filter((b) => b.res === 'BUST').length;\n    const nCyc = win + bust;\n    const lens = cyc.map((cy) => cy[cy.length - 1].betRow - cy[0].stepRow + 1);\n    if (cur.length) lens.push(cur[cur.length - 1].betRow - cur[0].stepRow + 1); // otwarty cykl też\n    let ms = 0, cs = 0;\n    for (const b of bets) { cs = b.res === 'WIN' ? 0 : cs + 1; ms = Math.max(ms, cs); }\n    let peak = 0, dd = 0;\n    for (const b of bets   };\n}\n\nfunction render() {\n  document.getElementById('hdrN').textContent = `n=${fmtN(codes.length)}${added.length ? ` (+${added.length})` : ''}`;\n  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === view));\n  document.getElementById('entry').style.display = view === 'gra' ? '' : 'none';\n  document.body.classList.toggle('tabv', view === 'tab');\n  ({ gra: renderGra, tab: renderTab, stat: renderStat, dane: renderDane })[view]();\n}\n\n// ---------------------------------------------------------------------\n// AKCJE\n// ---------------------------------------------------------------------\nlet toastT = null;\nfunction toast(html, ms = 3500) {\n  const t = document.getElementById('toast');\n  t.innerHTML = html; t.classList.add('on');\n  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), ms);\n}\n\nfunction addCode(c) {\n  added.push(c); saveAdded(); recompute();\n  const N = codes.length, i = N - 1, msgs = [];\n  eachT(() => ORD.forEach((o, mi) => {\n    if (!vis(o)) return;\n    const s = sims[mi], ci = cellInfo(s, i);\n    if (!ci) return;\n    const km = ci.txt.match(/k(\\d+) (\\d+) zł/);\n    if (ci.st === 'WIN') msgs.push(`<b>${o.id}<\/b>: k${km[1]} → <span style=\"color:#5fd38a\">WIN ✓ ${ci.txt.match(/\\+\\d+/)[0]}<\/span> · bilans ${fmtS(ci.bil)}`);\n    else if (ci.st === 'przegrana') msgs.push(`<b>${o.id}<\/b>: k${km[1]} → <span style=\"color:#ff8a8a\">pudło ✗<\/span> (następny k${+km[1] + 1})`);\n    else if (ci.st === 'BUST') msgs.push(`<b>${o.id}<\/b>: <span style=\"color:#ff6666\">BUST −${cum(K_LIMIT)}<\/span> · bilans ${fmtS(ci.bil)}`);\n    else if (ci.tag === 'T') msgs.push(`<b>${o.id}<\/b>: ▶ TRIGGER → GRA na Nr ${s.pending.betRow + 1} (+${o.m.off}) · k${s.k + 1}`);\n  }));\n  const nb = nextBets();\n  if (nb.length) msgs.push(`<b style=\"color:#ff9a4d\">▼ NASTĘPNY KOD = GRA xx1: ${nb.map(b => `${b.id} k${b.k} ${b.stake} zł`).join(', ')}<\/b>`);\n  toast(`Nr ${N}: <b>${c}<\/b>${msgs.length ? '<br>' + msgs.join('<br>') : ''}`, msgs.length ? 5000 : 1500);\n  if (navigator.vibrate) navigator.vibrate(nb.length ? [60, 60, 120] : 25);\n  render();\n  if (lsGet(LS_AUTOBK, '1') === '1' && added.length % 10 === 0) exportJSON(true);\n}\n\nfunction undo() {\n  if (!added.length) { toast('Brak dopisanych kodów do cofnięcia (kody z pliku są chronione).'); return; }\n  const c = added[added.length - 1];\n  if (!confirm(`Cofnąć ostatni kod Nr ${codes.length}: ${c}?`)) return;\n  added.pop(); saveAdded(); recompute(); render();\n  toast(`Cofnięto Nr ${codes.length + 1}: ${c}`);\n}\n\nfunction stamp() {\n  const d = new Date(), p = n => String(n).padStart(2, '0');\n  return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`;\n}\nfunction exportJSON(auto) {\n  const data = { kind: JSON_KIND, app: 'BUST xx1 (012 + ODM)', version: APP_VER, table: 'test60xx1012BUST.xlsx | test60xx1012BUSTodmienne.xlsx',\n                 created: new Date().toISOString(), n: codes.length, seed_n: SEED_N, codes };\n  const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });\n  const a = document.createElement('a');\n  a.href = URL.createObjectURL(blob);\n  a.download = `bust_razem_${stamp()}_n${codes.length}.json`;\n  document.body.appendChild(a); a.click(); a.remove();\n  setTimeout(() => URL.revokeObjectURL(a.href), 5000);\n  lsSet(LS_LASTBK, String(codes.length));\n  toast(auto ? `Auto-backup: ${a.download}` : `Zapisano ${a.download}`);\n}\n\n// ---------------------------------------------------------------------\n// IMPORT — ta sama logika co TOP7 (dopasowanie po Nr 1 albo po końcówce seed)\n// Każda różnica w części wspólnej = STOP, nic nie zmienione.\n// ---------------------------------------------------------------------\nfunction normCode(v) {\n  if (v === null || v === undefined) return null;\n  const s = String(v).trim();\n  if (!/^\\d{1,3}(\\.0+)?$/.test(s)) return null;\n  return String(parseInt(s, !x);\n  if (bad >= 0) throw new Error(`nieprawidłowy kod na pozycji ${bad + 1}: ${JSON.stringify(raw[bad])}`);\n\n  const al = alignFile(arr);\n  const newAll = al.tail;\n  let same = 0;\n  while (same < Math.min(added.length, newAll.length) && added[same] === newAll[same]) same++;\n  const lose = added.length - same;\n  const gain = newAll.length - same;\n  if (!gain) { toast(`Import: brak nowych kodów — plik ma ${arr.length} kodów, apka ${codes.length}${lose ? ' (plik starszy, kody z apki zostają)' : ''}.`, 5000); return; }\n\n  let msg = `Import (${src || kind}): ${fname}\\n` +\n            `Plik: ${arr.length} kodów${al.shift ? ` (numeracja przesunięta o ${al.shift > 0 ? '+' : ''}${al.shift})` : ''}\\n` +\n            `Zgodna część wspólna: ${al.overlap} kodów\\n` +\n            `Apka teraz: ${codes.length} → po imporcie: ${SEED_N + newAll.length}\\n` +\n            `Nowe kody: ${gain} (Nr ${SEED_N + same + 1}–${SEED_N + newAll.length})`;\n  if (lose) msg += `\\n\\n⚠ UWAGA: ${lose} kodów wpisanych w apce (od Nr ${SEED_N + same + 1}) nie zgadza się z plikiem lub go brak — zostaną zastąpione.`;\n  if (!confirm(msg + '\\n\\nOK?')) return;\n  if (lose && !confirm(`Na pewno zastąpić ${lose} kodów z apki?`)) return;\n  added = newAll.slice(); saveAdded(); recompute();\n  lsSet(LS_LASTIMP, `${src || kind} · ${new Date().toLocaleString('pl-PL')} · n=${codes.length} · +${gain}`);\n  render();\n  const nb = nextBets();\n  toast(`Zaimportowano: +${gain} kodów, teraz n=${codes.length}` +\n        (nb.length ? `<br><b style=\"color:#ff9a4d\">▼ NASTĘPNY KOD = GRA xx1: ${nb.map(b => `${b.id} k${b.k} ${b.stake} zł`).join(', ')}<\/b>` : ''), 6000);\n}\n\ndocument.getElementById('fileIn').onchange = e => {\n  const f = e.target.files[0]; e.target.value = '';\n  if (!f) return;\n  const rd = new FileReader();\n  rd.onload = () => {\n    try { importFile(JSON.parse(rd.result), f.name); }\n    catch (err) { alert('Import przerwany, nic nie zmieniono:\\n' + err.message); }\n  };\n  rd.readAsText(f);\n};\n\nconst $in = document.getElementById('codeIn');\nconst VALID = new Set(CODES16);\nfunction submitCode() {\n  const v = $in.value.trim();\n  if (!v) return;\n  const c = v.length === 3 ? v : null;\n  if (!c || !VALID.has(c)) {\n    $in.classList.remove('bad'); void $in.offsetWidth; $in.classList.add('bad');\n    toast(`„${esc(v)}” to nie jest kod z ciągu (1. cyfra 0–3, 2. i 3. cyfra 0–1).`);\n    $in.select(); return;\n  }\n  $in.value = ''; $in.classList.remove('bad');\n  addCode(c);\n  $in.focus();\n}\n$in.addEventListener('input', () => {\n  $in.value = $in.value.replace(/\\D/g, '').slice(0, 3);\n  $in.classList.remove('bad');\n  if ($in.value.length === 3) submitCode();\n});\n$in.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); submitCode(); } });\ndocument.getElementById('addBtn').onclick = submitCode;\ndocument.getElementById('undo').onclick = () => { undo(); $in.focus(); };\n\ndocument.querySelectorAll('nav button').forEach(b => b.onclick = () => { view = b.dataset.v; if (view === 'tab') { tabLimit = 80; tabFocus = null; } render(); window.scrollTo(0, 0); });\n\nrecompute();\nrender();\n<\/script>\n<script>// ===== T60 RAZEM — nakładka wspólna (wstrzykiwana do każdej tabeli) =====\n// Nie zmienia silnika ani widoków. Wyłącza tylko: własne pole wpisu, DANE,\n// autokopie, wibrację, kradzież fokusu z pola RAZEM; dodaje API window.T60.\n(function () {\n  const _focus = HTMLElement.prototype.focus;\n  HTMLElement.prototype.focus = function () { if (window.__t60focus) return _focus.apply(this, arguments); };\n  const _conf = window.confirm.bind(window);\n  window.confirm = function (m) { return window.__t60auto ? true : _conf(m); };\n  try { Object.defineProperty(navigator, 'vibrate', { value: function () { return true; }, configurable: true }); } catch (e) {}\n})();\nwindow.__t60esc = s => String(s).replace(/[&<>\"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;' }[c]));\nwindow.__t60flash = f    let x = `<div class=\"ut\"><div class=\"ut-top\">${A.top ? A.top() : ''}<\/div>`;\n    x += `<div class=\"ut-ch\">${['ALL', ...models.map(m => m.id)].map(id => `<button data-m=\"${esc(id)}\" class=\"${S.sel === id ? 'on' : ''}\">${id === 'ALL' ? 'WSZ' : esc(id)}<\/button>`).join('')}<\/div>`;\n    x += `<div class=\"ut-tool\"><button id=\"utEv\" class=\"${S.onlyEv ? 'on' : ''}\">tylko zdarzenia<\/button>${A.tools ? A.tools() : ''}<button id=\"utEnd\">↓ koniec<\/button><button id=\"utLeg\" class=\"${S.leg ? 'on' : ''}\">legenda ${S.leg ? '▴' : '▾'}<\/button><\/div>`;\n    if (S.leg) x += `<div class=\"ut-leg\">${A.legend()} Tapnij wiersz → pełny opis.<\/div>`;\n    if (!isAll && A.desc) x += `<div class=\"ut-desc\">${A.desc(mi)}<\/div>`;\n    x += `<div class=\"ut-tw\" id=\"utTw\">`;\n    if (from > 0) x += `<button class=\"ut-more\" id=\"utMore\">▲ Pokaż +200 wcześniejszych (ukrytych ${from})<\/button>`;\n    if (isAll) {\n      x += `<table><colgroup><col style=\"width:52px\"><col style=\"width:38px\">${models.map(() => '<col>').join('')}<\/colgroup><thead><tr><th>Nr<\/th><th>Kod<\/th>${models.map(m => `<th style=\"text-align:center;padding:4px 1px\">${esc(m.id)}<\/th>`).join('')}<\/tr><\/thead><tbody>`;\n      for (const i of rows) {\n        const g = i >= N;\n        let cells = '', chips = [];\n        models.forEach((m, k) => {\n          const t = A.tag(k, i);\n          cells += t ? `<td class=\"mi\" style=\"${t.css || ''}\">${esc(t.t)}<\/td>` : '<td class=\"mi\"><\/td>';\n          const ch = A.chip ? A.chip(k, i) : null;\n          if (ch) chips.push(`<span class=\"gc\" style=\"${ch.css || ''}\">${esc(m.id)} ${esc(ch.t)}<\/span>`);\n        });\n        x += `<tr data-i=\"${i}\" class=\"${g ? 'ghost' : ''}${A.isNew && A.isNew(i) ? ' new' : ''}\"><td class=\"nr\">${i + 1}<\/td><td class=\"c${!g && A.hit && A.hit(i) ? ' hit' : ''}\">${g ? (i === N ? 'nast.' : '…') : A.code(i)}<\/td>${cells}<\/tr>`;\n        if (chips.length) x += `<tr data-i=\"${i}\" class=\"gr${g ? ' ghost' : ''}\"><td><\/td><td colspan=\"${models.length + 1}\">${chips.join('')}<\/td><\/tr>`;\n      }\n    } else {\n      x += `<table><colgroup><col style=\"width:52px\"><col style=\"width:38px\"><col style=\"width:46%\"><col><\/colgroup><thead><tr><th>Nr<\/th><th>Kod<\/th><th>GRA<\/th><th>Stan / Rola<\/th><\/tr><\/thead><tbody>`;\n      for (const i of rows) {\n        const g = i >= N, c = A.cell(mi, i) || {};\n        const stan = c.stan || (g ? { t: i === N ? 'następny kod' : 'przyszły kod', css: 'color:#8b93a7' } : { t: '—', css: NEU });\n        const gra = c.gra;\n        x += `<tr data-i=\"${i}\" class=\"${g ? 'ghost' : ''}${A.isNew && A.isNew(i) ? ' new' : ''}\"><td class=\"nr\">${i + 1}<\/td><td class=\"c${!g && A.hit && A.hit(i) ? ' hit' : ''}\">${g ? (i === N ? 'nast.' : '…') : A.code(i)}<\/td>${cellHtml('g', gra)}${cellHtml('s', stan)}<\/tr>`;\n      }\n    }\n    x += `<\/tbody><\/table><\/div><\/div>`;\n    h.innerHTML = x;\n    if (A.bindTop) A.bindTop(h);\n    h.querySelectorAll('.ut-ch button').forEach(b => b.onclick = () => { S.sel = b.dataset.m; S.limit = 80; S.focus = null; if (A.onSel) A.onSel(S.sel); render(host, A); });\n    h.querySelector('#utEv').onclick = () => { S.onlyEv = !S.onlyEv; render(host, A); };\n    h.querySelector('#utLeg').onclick = () => { S.leg = !S.leg; render(host, A); };\n    h.querySelector('#utEnd').onclick = () => { S.focus = null; S.limit = 80; render(host, A); };\n    if (A.bindTools) A.bindTools(h);\n    const tw = h.querySelector('#utTw');\n    const mb = h.querySelector('#utMore');\n    if (mb) mb.onclick = () => { const fb = tw.scrollHeight - tw.scrollTop; S.limit += 200; S.keep = fb; render(host, A); };\n    const mark = i => { S.selRow = i; tw.querySelectorAll('tbody tr.sel').forEach(t => t.classList.remove('sel')); tw.querySelectorAll(`tbody tr[data-i=\"${i}\"]`).forEach(t => t.classList.add('sel')); };\n    if (S.selRow != null) mark(S.selRow);\n    tw.querySelectorAll('tbody tr').forEach(tr => tr.onclick = () => { mark(+tr.dataset.i); popup(+tr.dataset.i); });\n    // tabela wypełnia ekran do dolnego paska; przewija się tylko tabela (nagłówek kolumn zostaje)\n    const fit = () => {\n      const top = tw.getBoundingClientRect().top;\n      tw.style.height = Math.max(220, window.innerHeight - top - (A.bottomH ? A.bottomH() : 0) - 6) + 'px';\n    };\n    window.scrollTo(0, 0); fit();\n    requestAnimationFrame(() => {\n      fit();\n      if (S.keep != null) { tw.scrollTop = tw.scrollHeight - S.keep; S.keep = null; return; }\n      const fr = S.focus != null ? tw.querySelector(`tbody tr[data-i=\"${S.focus}\"]`) : null;\n      if (fr) { tw.scrollTop = Math.max(0, fr.offsetTop - tw.clientHeight / 3); fr.classList.add('fx'); setTimeout(() => fr.classList.remove('fx'), 2600); S.focus = null; }\n      else tw.scrollTop = tw.scrollHeight;\n    });\n  }\n  // otwarcie modelu z innego ekranu (tapnięcie w GRA): model + wiersz do pokazania\n  function open(id, focusI) { S.sel = id; S.focus = focusI == null ? null : focusI; S.limit = Math.max(80, (A ? A.N() : 0) - (focusI == null ? 0 : focusI) + 40); }\n\n  function popup(i) {\n    const N = A.N(), models = A.models(), isAll = S.sel === 'ALL', g = i >= N;\n    const blk = x => x ? (x.full && x.full.length ? x.full : [x.t]).map(t => `<div class=\"bl\" style=\"${x.css || ''}\">${esc(t)}<\/div>`).join('') + (x.sub ? `<div class=\"hs\">${esc(x.sub)}<\/div>` : '') : '<div class=\"hs\">—<\/div>';\n    const det = d => d && d.length ? `<table>${d.map(([k, v]) => `<tr><td>${esc(k)}<\/td><td>${esc(v)}<\/td><\/tr>`).join('')}<\/table>` : '';\n    let b = `<button class=\"x\">✕<\/button><h3>Nr ${i + 1} · ${g ? (i === N ? 'następny kod' : 'przyszły kod') : `kod <b>${A.code(i)}<\/b>`}<\/h3>`;\n    const others = skip => {\n      let o = '', n = 0;\n      models.forEach((m, k) => {\n        if (k === skip || !A.ev(k, i)) return;\n        const c = A.cell(k, i) || {};\n        n++; o += `<div class=\"mh\">${esc(m.id)}<\/div>${c.gra ? blk(c.gra) : (c.stan ? blk(c.stan) : '')}`;\n      });\n      return { o, n };\n    };\n    if (!isAll) {\n      const mi = models.findIndex(m => m.id === S.sel), c = A.cell(mi, i) || {};\n      b += `<div class=\"hs\">${esc(S.sel)}${A.descTxt ? ' · ' + esc(A.descTxt(mi)) : ''}<\/div>`;\n      b += `<div class=\"lb\">GRA<\/div>${blk(c.gra)}<div class=\"lb\">Stan / Rola<\/div>${blk(c.stan || (g ? { t: i === N ? 'następny kod — jeszcze nie wpisany' : 'przyszły kod — jeszcze nie wpisany', css: 'color:#8b93a7' } : null))}`;\n      if (c.det && c.det.length) b += `<div class=\"lb\">Szczegóły<\/div>${det(c.det)}`;\n      const ot = others(mi);\n      b += `<div class=\"lb\" style=\"margin-top:14px\">Pozostałe modele na tym wierszu (${ot.n})<\/div>${ot.n ? ot.o : '<div class=\"hs\">brak innych zdarzeń<\/div>'}`;\n    } else {\n      if (A.rowInfo) b += det(A.rowInfo(i));\n      const ot = others(-1);\n      b += `<div class=\"lb\">Zdarzenia na tym wierszu (${ot.n})<\/div>${ot.n ? ot.o : '<div class=\"hs\">brak zdarzeń<\/div>'}`;\n    }\n    if (isAll) b += '';\n    const p = document.createElement('div'); p.className = 'ut-pop';\n    p.innerHTML = `<div class=\"sh\">${b}<\/div>`;\n    p.onclick = e => { if (e.target === p || e.target.classList.contains('x')) p.remove(); };\n    document.body.appendChild(p);\n  }\n  return { render, open, S, popup };\n})();\n<\/script>\n<script>// ===== UG — wspólny ekran GRA (wzór PIKOFF): baner + karta na model + okno ze wszystkimi etykietami =====\n// cfg = { N, top?, bindTop?, note?, idleSub?, sections:[{name?, cards:[{id, rule, lines:[{p,txt,sub,er?}], meta:[l,r], go(er?)}]}], last:[kody] }\n// p: 1 GRA pewna · 2 GRA warunkowa / w toku · 3 trigger jeśli wpadnie · 4 gra za n / start · 5 inne zdarzenie · 6 brak\nwindow.UG = (function () {\n  const esc = s => String(s == null ? '' : s).replace(/[&<>\"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;' }[c]));\n  const css = `\n.ug{color:#e8ebf2;font:14px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}\n.ug-ban{border-radius:10px;padding:9px 12px;margin-bottom:8px;font-weight:700}\n.ug-ban.bet{background:#ff6600;color:#fff}.ug-ban.idle{background:#242a38;color:#e8ebf2;font-weight:500}\n.ug-ban .big{font-size:16px}.ug-ban .sub{font-weight:500;font-size:12px;margin-top:3px;opacity:.95}\n.ug-note{background:#1b1f2a;border:1px solid #323a4d;border-radius:10px;padding:8px 10px;margin-bottom:8px;font-size:12.5px;color:#c9cfdc}\n.ug-note b{color:#e8ebf2}\n.ug-sec{background:#1b1f2a;border:1px solid #323a4d;border-radius:10px;padding:8px;margin-bottom:10px}\n.ug-sh{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 6px;font-size:13px}\n.ug-sh b{font-size:14px}.ug-sh .g{font-weight:800;color:#ff9a4d}.ug-sh .m{color:#8b93a7;font-size:12px}\n.ug-mc{border-left:5px solid #323a4d;background:#242a38;border-radius:8px;padding:7px 9px;margin-bottom:6px;cursor:pointer}\n.ug-mc{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:pan-y}.ug-mc.hold{filter:brightness(1.3);transition:filter .45s}\n.ug-hint{color:#8b93a7;font-size:11px;margin:-2px 2px 6px}\n.ug-mc.b1{border-left-color:#ff6600}.ug-mc.b2{border-left-color:#ff9a4d}.ug-mc.b3{border-left-color:#2e75b6}.ug-mc.b4{border-left-color:#7030a0}\n.ug-mc .h{display:flex;justify-content:space-between;gap:6px;align-items:baseline}\n.ug-mc .id{font-weight:800;font-size:15px;white-space:nowrap}\n.ug-mc .rule{color:#8b93a7;font-size:11.5px;text-align:right}\n.ug-mc .go{color:#ff9a4d;font-size:11px;margin-left:6px;font-weight:700;white-space:nowrap;padding:2px 0 2px 6px}\n.ug-st{margin-top:5px;padding:6px 8px;border-radius:7px;font-weight:700;font-size:13px}\n.ug-st .s{display:block;font-weight:500;font-size:11.5px;opacity:.85;margin-top:1px}\n.ug-st.p1{background:#ff6600;color:#fff;box-shadow:0 0 0 2px #fff inset;font-size:14px}\n.ug-st.p2{background:rgba(255,102,0,.18);color:#ffcfa8;border:1.5px dashed #ff6600}\n.ug-st.p3{background:#DEEBF */\nconst TRIG_M = new Set([1]);\nconst CAP_K  = 8;\nconst STAWKI = [8,16,32,64,128,256,512,1024];\nconst WYPLATA = {1:16,2:24,3:40,4:72,5:136,6:264,7:520,8:1032};\nconst BUST_PEN = -2040;\nconst BRANCHES = [\n  {name:'T1 +8', grid:'+8', off:9,  capK:8, cls:'b0'},\n  {name:'T1 +9', grid:'+9', off:10, capK:8, cls:'b1'},\n];\nconst PRIO_RANK = {loss:0, win:1, trigger:2, start:3, step:4, prep:5};\nconst APP_VER='1.1.0';\nconst APP_DATE='2026-09-28';\nconst KEY='trojka_xx1_v13_codes_v1';\nconst PAGE=250;\nconst SEED_LEN=12557;\n\nfunction toCode(v){\n  if(v==null) return null;\n  let s=String(v).trim().replace(/[\"'\\s]/g,'');\n  if(s==='') return null;\n  s=s.replace(/[^0-9]/g,'');\n  if(s==='') return null;\n  return s.padStart(3,'0').slice(-3);\n}\nfunction isHit(k){ return k && k.length>=3 && k[k.length-1]==='1'; }\n\nfunction parseV13(codes){\n  const N=codes.length, hit=codes.map(isHit);\n  const role=new Array(N).fill('SKIP');\n  const Kval=new Array(N).fill(null);\n  const cycles=[];\n  let k=1, cooldown=false, i=0, attempts=[];\n  while(i<N){\n    if(!hit[i]){ cooldown=false; i++; continue; }\n    if(cooldown){ i++; continue; }\n    if(i+1<N && hit[i+1]){\n      role[i]='para'; role[i+1]='sprawdz'; Kval[i]=k; Kval[i+1]=k;\n      const att={k, paraPos:i, sprawdzPos:i+1};\n      if(i+2<N && hit[i+2]){\n        role[i+2]='win'; Kval[i+2]=k; attempts.push(att);\n        cycles.push({winPos:i+2, M:k, attempts});\n        attempts=[]; k=1; cooldown=true; i+=3;\n      } else {\n        if(i+2<N) role[i+2]='miss';\n        attempts.push(att); k+=1; i+=3;\n      }\n    } else { i++; }\n  }\n  /* stan bazy na końcu */\n  let base='idle', baseTag='szukam pary xx1', baseNextIf='';\n  const last = N>0 ? codes[N-1] : null;\n  const lastHit = last!=null && isHit(last);\n  if(cooldown){\n    base='cooldown'; baseTag='cooldown po WIN — kolejne xx1 są pomijane';\n    baseNextIf='następny kod: jeśli xx1 → SKIP (cooldown); dowolne inne → kończy cooldown';\n  } else if(attempts.length>0){\n    /* cykl otwarty na K=k, i patrzymy gdzie jesteśmy */\n    /* sprawdź czy ostatni wiersz miał rolę para/sprawdz/miss */\n    const lastRole = N>0 ? role[N-1] : null;\n    if(lastRole==='para'){\n      base='need_sprawdz';\n      baseTag='cykl K='+k+' otwarty · szukam SPRAWDŹ (kolejne xx1)';\n      baseNextIf='następny kod: xx1 → SPRAWDŹ K'+k+'; nie-xx1 → SKIP';\n    } else if(lastRole==='sprawdz'){\n      base='need_win';\n      baseTag='cykl K='+k+' po SPRAWDŹ · trzeci xx1 = WIN, inaczej miss';\n      baseNextIf='następny kod: xx1 → ✓ WIN M='+k+(TRIG_M.has(k)?' (⚡ TRIGGER!)':' (bez triggera)')+'; nie-xx1 → miss (K→'+(k+1)+')';\n    } else {\n      /* miss lub SKIP po miss — otwarty na K, szukam nowej pary */\n      base='need_para';\n      baseTag='cykl otwarty K='+k+' · szukam nowej pary xx1';\n      baseNextIf='następny kod: xx1 → para K'+k+'; nie-xx1 → SKIP';\n    }\n  } else {\n    base='idle';\n    baseTag='między cyklami · szukam pary xx1 (K=1)';\n    baseNextIf='następny kod: xx1 → para K1; nie-xx1 → SKIP';\n  }\n  return {role, Kval, cycles, N,\n          openAttempts:attempts.length, curK:k, cooldown,\n          base, baseTag, baseNextIf};\n}\n\nfunction buildBranch(cycles, off, capK){\n  const Ncyc=cycles.length;\n  const winSegs=Array.from({length:Ncyc},()=>[]);\n  const stepLab={};\n  const trigNo=new Array(Ncyc).fill(0);\n  let tc=0;\n  for(let w=0;w<Ncyc;w++) if(TRIG_M.has(cycles[w].M)){ tc++; trigNo[w]=tc; }\n  for(let p=0;p<Ncyc;p++){\n    if(!TRIG_M.has(cycles[p].M)) continue;\n    const n=trigNo[p], isOpen=(p+off)>=Ncyc;\n    for(let d=0; d<=off; d++){\n      const cp=p+d; if(cp>=Ncyc) break;\n      if(d===0){\n        winSegs[cp].push({order:1,d:0,prio:'trigger',\n          text:'▶ TRIG#'+n+' M='+cycles[p].M+(isOpen?' (OPEN)':'')});\n      } else if(d<=off-2){\n        winSegs[cp].push({order:3,d,prio:'prep',\n          text:'· przyg '+d+'/'+(off-1)+' [T:'+n+']'});\n      } else if(d===off-1){\n        winSegs[cp].push({order:2,d,prio:'start',\n          text:'★ START · gra na nast. [T:'+n+']'});\n      } else {\n        const cyc=cycles[cp], Mg=cyc.M;\n        if(Mg<=capK) winSegs[cp].push({order:0,d:off,prio:'win',\n          text:'✓ WIN K='+Mg+' +'+WYPLATA[Mg]+'zł [T:'+n+']'});\n        else winSegs[cp].push({order:0,d:off,prio:'loss',\n          text:'✗ BUST K='+capK+' '+BUST_PEN+'zł [T:'+n+']'});\n        const kmax=Math.min(Mg,capK);\n        for(const a of cyc.attempts) if(a.k>=1 && a.k<=kmax){\n          const l='k'+a.k+' stawka '+STAWKI[a.k-1]+'zł [T:'+n+']';\n          stepLab[a.paraPos]=l; stepLab[a.sprawdzPos]=l;\n        }\n      }\n    }\n  }\n  const byRow={};\n  for(let w=0;w<Ncyc;w++){\n    const s=winSegs[w];\n    if(s.length){\n      s.sort((a,b)=> a.order-b.order || b.d-a.d);\n      let prio=s[0].prio;\n      for(const x of s) if(PRIO_RANK[x.prio]<PRIO_RANK[prio]) prio=x.prio;\n      byRow[cycles[w].winPos]={text:s.map(x=>x.text).join(' | '), prio};\n    }\n  }\n  for(const pos in stepLab) byRow[pos]={text:stepLab[pos], prio:'step'};\n  let N=0,W=0,B=0,pnl=0;\n  for(let p=0;p<Ncyc;p++){ if(!TRIG_M.has(cycles[p].M))continue;\n    if(p+off<Ncyc){ N++; const Mg=cycles[p+off].M;\n      if(Mg<=capK){W++;pnl+=WYPLATA[Mg];} else {B++;pnl+=BUST_PEN;} } }\n  const openWin=[];\n  for(let p=0;p<Ncyc;p++){ if(!TRIG_M.has(cycles[p].M))continue;\n    if(p+off>=Ncyc){\n      const d=(Ncyc-1)-p, winPos=cycles[p].winPos;\n      /* najnowszy event tego triggera */\n      let last=-1;\n      for(let pos=cycles[Math.min(Ncyc-1,p+d)].winPos; pos<cycles.length; pos++){}\n      openWin.push({tn:trigNo[p], off, d, winPos, trigM:cycles[p].M});\n    }\n  }\n  return {byRow, trigTotal:tc, N, W, B, pnl, openWin};\n}\n\nclass V13Model {\n  constructor(rawCodes){\n    this.codes=rawCodes.map(toCode).filter(Boolean);\n    const p=parseV13(this.codes);\n    this.N=p.N;\n    this.cycles=p.cycles;\n    this.baseState={curK:p.curK, cooldown:p.cooldown, openAttempts:p.openAttempts,\n                    cyclesClosed:p.cycles.length, base:p.base, baseTag:p.baseTag,\n                    baseNextIf:p.baseNextIf};\n    this.rowRole={};\n    for(let i=0;i<this.N;i++){\n      const er=i+1, r=p.role[i]; let txt,K=null,bk;\n      if(r==='para'){txt='para K'+p.Kval[i];bk='para';}\n      else if(r==='sprawdz'){txt='SPRAWDŹ K'+p.Kval[i];bk='sprawdz';}\n      else if(r==='win'){txt='✓ WIN';K=p.Kval[i];bk='win';}\n      else if(r==='miss'){txt='miss';bk='miss';}\n      else {txt='SKIP';bk='skip';}\n      this.rowRole[er]={txt,K,bk};\n    }\n    this.rowModel={}; for(let er=1;er<=this.N;er++) this.rowModel[er]={};\n    this.branches={};\n    BRANCHES.forEach(b=>{\n      const r=buildBranch(this.cycles,b.off,b.capK);\n      /* dopisz eventEr do każdego openWin */\n      r.openWin.forEach(w=>{\n        let e=-1;\n        for(let pos=this.N-1;pos>=0;pos--){\n          const mm=r.byRow[pos];\n          if(mm && (mm.text.indexOf('[T:'+w.tn+']')>=0 || mm.text.indexOf('TRIG#'+w.tn+' ')>=0)){ e=pos+1; break; }\n        }\n        w.eventEr=e;\n        w.trigEr=w.winPos+1;\n      });\n      let last=-1; for(const pos in r.byRow){ if((+pos+1)>last) last=+pos+1; }\n      r.lastEventEr=last;\n      this.branches[b.name]=r;\n      for(const pos in r.byRow) this.rowModel[+pos+1][b.name]=r.byRow[pos];\n    });\n  }\n  stats(name){ const b=this.branches[name];\n    return {trig:b.trigTotal, N:b.N, W:b.W, B:b.B, pnl:b.pnl, open:b.openWin.length,\n            wr:b.N?100*b.W/b.N:0}; }\n}\n\n/* ================================================================\n   APLIKACJA\n   ================================================================ */\nlet codes=[], model=null, cur='T1 +8', filterOn=false, shown=PAGE, canStore=true;\nlet view='gra';\nconst $ = id => document.getElementById(id);\n\nfunction load(){\n  try{\n    const s=localStorage.getItem(KEY);\n    if(s!==null && s!=='') return s.split(',');\n  }catch(e){ canStore=false; $('warn').style.display='block'; }\n  return SEED ? SEED.match(/.{3}/g) : [];\n}\nfunction save(){\n  if(!canStore) return;\n  try{ localStorage.setItem(KEY, codes.join(',')); }\n  catch(e){ canStore=false; $('warn').style.display='block'; }\n}\nfunction recompute(){ model=new V13Model(codes); }\n\n/* NAV */\nfunction setView(v){\n  view=v;\n  document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('on', b.dataset.v===v));\n  $('gra').style.display   = v==='gra'   ? '' : 'none';\n  $('tw').style.display    = v==='tab'   ? '' : 'none';\n  $('stats').style.display = v==='stats' ? '' : 'none';\n  $('tabs').style.display  = v==='tab'   ? '' : 'none';\n  renderAll(v!=='tab');\n}\n\n/* SUBTABS (branch, tylko w TABELA) */\nfunction renderTabs(){\n  const tabs=$('tabs'); tabs.innerHTML='';\n  BRANCHES.forEach(b=>{\n    const btn=document.createElement('button');\n    btn.className='tab '+b.cls+(b.name===cur?' on':'');\n    btn.innerHTML=b.name+'<small>gra na cyklu T'+b.grid+'<\/small>';\n    btn.onclick=()=>{\n      cur=b.name;\n      document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));\n      btn.classList.add('on');\n      $('thMod').textContent=b.name;\n      shown=PAGE; renderTable(false);\n    };\n    tabs.appendChild(btn);\n  });\n}\n\n/* ============================================================\n   GRA — żywy status per gałąź + prognoza na następny wiersz\n   ============================================================ */\nfunction baseNext(){\n  return model.baseState.baseTag;\n}\nfunction baseNextIf(){\n  return model.baseState.baseNextIf;\n}\nfunction branchStateForNext(bname){\n  /* Co się stanie z tą gałęzią na następnym kodzie?\n     Kluczowa sytuacja: jeśli baza ma cykl otwarty i następny kod = WIN,\n     zamknie cykl. Jeśli M=1 → nowy TRIGGER dla tej gałęzi.\n     Ale najpierw: czy mamy otwarte okna? Jeśli tak — pokaż stan każdego. */\n  const bs=model.baseState;\n  const br=model.branches[bname];\n  const ow=br.openWin;\n  const info=[];\n  ow.forEach(w=>{\n    const off=w.off, d=w.d;\n    let phase, hint, cls='';\n    if(d>=off-1){\n      /* Grany cykl jest KOLEJNYM zamkniętym cyklem. Czyli GRA na najbliższy WIN. */\n      phase='▶ GRA · na najbliższy WIN (M='+d+')';\n      hint='najbliższy WIN → K=M cyklu; jeśli M≤8: wypłata, inaczej BUST';\n      cls='now';\n    } else if(d===off-2){\n      phase='★ START za 1 cykl';\n      hint='po kolejnym WIN → START, grasz na następnym WIN';\n      cls='hot';\n    } else {\n      phase='· przygotowanie '+d+'/'+(off-1);\n      hint='czekam na kolejny WIN (przesuwa okno)';\n    }\n    info.push({tn:w.tn, phase, hint, cls, eventEr:w.eventEr, trigEr:w.trigEr, d, off});\n  });\n  return info;\n}\nfunction grayNextEventHint(){\n  /* Co następny kod może wywołać w bazie? To już mamy z parseV13.\n     Dodatkowo: jeśli baza jest \"need_win\" i M=1, to za chwilę wskoczy TRIGGER\n     dla OBU gałęzi jednocześnie. */\n  const bs=model.baseState;\n  if(bs.base==='need_win'){\n    const k=bs.curK;\n    if(TRIG_M.has(k)){\n      return '⚡ Jeśli następny kod = <b>xx1<\/b> → WIN M='+k+' = <b>nowy TRIGGER<\/b> dla T1 +8 i T1 +9!';\n    } else {\n      return 'Jeśli następny kod = xx1 → WIN M='+k+' (bez triggera — trigger tylko na M=1)';\n    }\n  }\n  return null;\n}\n\nfunction renderGra(){\n  const el=$('gra'); el.innerHTML='';\n  const bs=model.baseState;\n  const nxt = model.N+1;\n\n  /* Nagłówek: NASTĘPNY WIERSZ + stan bazy */\n  const head=document.createElement('div'); head.className='nxthead';\n  head.innerHTML =\n    '<div class=\"hd\"><span>NASTĘPNY WIERSZ <b>Nr '+nxt+'<\/b><\/span>'+\n    '<span>cykli WIN: <b style=\"color:var(--gold)\">'+bs.cyclesClosed+'<\/b><\/span><\/div>'+\n    '<div class=\"base\"><b>Baza:<\/b> '+bs.baseTag+'<\/div>'+\n    '<div class=\"prog\">'+bs.baseNextIf+'<\/div>';\n  const trigHint = grayNextEventHint();\n  if(trigHint){\n    const p=document.createElement('div'); p.className='prog';\n    p.style.background='rgba(232,178,92,0.10)';\n    p.style.borderLeft='3px solid var(--gold)';\n    p.style.marginTop='6px';\n    p.innerHTML = trigHint;\n    head.appendChild(p);\n  }\n  el.appendChild(head);\n\n  /* Per gałąź: nagłówek + otwarte okna (klikalne) */\n  BRANCHES.forEach(b=>{\n    const st=model.stats(b.name);\n    const info=branchStateForNext(b.name);\n    const div=document.createElement('div');\n    div.className='brh '+b.cls;\n    const hdr='<div class=\"hdr\"><b>'+b.name+' · gra na cyklu T'+b.grid+'<\/b>'+\n      '<span class=\"pnl\">'+st.N+' rozgrywek · WR '+st.wr.toFixed(1)+'% · PnL <b>'+(st.pnl>=0?'+':'')+st.pnl+' zł<\/b><\/span><\/div>';\n    let rows='';\n    if(!info.length){\n      rows='<div class=\"row none\">Brak otwartych okien. Czekamy na kolejny TRIGGER (WIN M=1).<\/div>';\n    } else {\n      info.forEach(w=>{\n        const target = w.d>=w.off-1 ? w.eventEr : w.eventEr;\n        rows += '<div class=\"row '+w.cls+'\" data-er=\"'+target+'\"><div class=\"l\"><b>#'+w.tn+'<\/b> · '+w.phase+'<\/div>'+\n                '<div class=\"r\">'+w.hint+'<\/div><\/div>';\n      });\n    }\n    div.innerHTML = hdr + rows;\n    el.appendChild(div);\n  });\n\n  /* Legenda */\n  const leg=document.createElement('div');\n  leg.className='legend';\n  leg.innerHTML='<b>Tap<\/b> w wiersz gałęzi → skok do <b>TABELI<\/b> tej gałęzi (do najnowszego eventu tego triggera).<br>'+\n                'TRIGGER = WIN cyklu z M=1 · GRA = najbliższy WIN zamyka cykl grany (off=9 dla +8, off=10 dla +9).';\n  el.appendChild(leg);\n\n  /* Bindings */\n  el.querySelectorAll('.row[data-er]').forEach(r=>{\n    r.onclick=()=>{\n      const er=+r.dataset.er;\n      /* jaki branch? sprawdź parent */\n      const parent=r.closest('.brh');\n      const isB1 = parent.classList.contains('b1');\n      cur = isB1 ? 'T1 +9' : 'T1 +8';\n      setView('tab');\n      /* po renderze — jumpTo */\n      setTimeout(()=>jumpTo(er), 30);\n    };\n  });\n}\n\n/* ============================================================\n   TABELA\n   ============================================================ */\nfunction visibleRows(){\n  const out=[];\n  for(let er=model.N; er>=1; er--){\n    if(filterOn){ if(!(model.rowModel[er] && model.rowModel[er][cur])) continue; }\n    out.push(er);\n    if(out.length>=shown) break;\n  }\n  return out.reverse();\n}\nfunction countFiltered(){\n  let c=0;\n  for(let er=1; er<=model.N; er++) if(model.rowModel[er] && model.rowModel[er][cur]) c++;\n  return c;\n}\nconst BK_FILL={para:'#FFE699',sprawdz:'#F4B084',win:'#C6EFCE',miss:'#FCE4D6',skip:'#FFFFFF'};\nconst MODEL_STYLE={\n  trigger:['#C00000','#FFFFFF'], prep:['#FFF2CC','#000000'], start:['#9933FF','#FFFFFF'],\n  step:['#BDD7EE','#000000'], win:['#00B050','#FFFFFF'], loss:['#FF0000','#FFFFFF'],\n};\n\nfunction renderTable(keepScroll){\n  const tw=$('tw'), tb=$('tb');\n  const atBottom = keepScroll ? false : true;\n  tb.innerHTML='';\n  if(!model.N){ $('empty').style.display='block'; return; }\n  $('empty').style.display='none';\n  const rows=visibleRows();\n  const total=filterOn ? countFiltered() : model.N;\n  const frag=document.createDocumentFragment();\n  if(rows.length<total){\n    const tr=document.createElement('tr'); const td=document.createElement('td');\n    td.colSpan=5; td.style.padding='0';\n    const btn=document.createElement('button'); btn.id='more';\n    btn.textContent='↑ Pokaż wcześniejsze ('+(total-rows.length)+' wierszy)';\n    btn.onclick=()=>{ shown+=PAGE; renderTable(true); };\n    td.appendChild(btn); tr.appendChild(td); frag.appendChild(tr);\n  }\n  for(const er of rows){\n    const r=model.rowRole[er] || {txt:'',K:null,bk:'skip'};\n    const mm=(model.rowModel[er]||{})[cur];\n    const tr=document.createElement('tr');\n    if(isHit(model.codes[er-1])) tr.className='hit';\n    if(er>SEED_LEN) tr.className+=' newrow';\n    const bg=BK_FILL[r.bk] || '#fff';\n    const cell=(cls,txt,style)=>{ const td=document.createElement('td'); td.className=cls;\n      td.textContent=txt; if(style) Object.assign(td.style,style); return td; };\n    tr.appendChild(cell('c-nr', er, {background:bg}));\n    tr.appendChild(cell('c-kod mono', model.codes[er-1]||'', {background:bg}));\n    tr.appendChild(cell('c-rola', r.txt, {background:bg}));\n    tr.appendChild(cell('c-k', r.K==null?'':r.K, {background:bg}));\n    if(mm){\n      const st=MODEL_STYLE[mm.prio] || ['#FFFFFF','#000000'];\n      tr.appendChild(cell('c-mod', mm.text, {background:st[0], color:st[1]}));\n    } else {\n      tr.appendChild(cell('c-mod','',{background:'#FFFFFF'}));\n    }\n    frag.appendChild(tr);\n  }\n  tb.appendChild(frag);\n  if(atBottom) requestAnimationFrame(()=>{ tw.scrollTop=tw.scrollHeight; });\n}\n\nfunction jumpTo(er){\n  if(!er || er<1 || er>model.N) return;\n  if(filterOn){ filterOn=false; $('tFil').classList.remove('on'); }\n  const needed=model.N-er+1;\n  if(shown<needed) shown=needed+20;\n  renderTable(true);\n  requestAnimationFrame(()=>{\n    const rows=document.querySelectorAll('#tb tr');\n    for(const tr of rows){\n      const nrCell=tr.querySelector('.c-nr');\n      if(nrCell && Number(nrCell.textContent)===er){\n        tr.classList.remove('flash'); void tr.offsetWidth; tr.classList.add('flash');\n        tr.scrollIntoView({block:'center', behavior:'smooth'}); break;\n      }\n    }\n  });\n  if(navigator.vibrate) navigator.vibrate(10);\n}\n\n/* ============================================================\n   STATYSTYKI\n   ============================================================ */\nfunction renderStats(){\n  const b=$('stats'); b.innerHTML='';\n  BRANCHES.forEach(m=>{\n    const s=model.stats(m.name);\n    const d=document.createElement('div'); d.className='stat';\n    d.innerHTML='<h3>'+m.name+' — gra na cyklu T'+m.grid+' · K8<\/h3>'+\n      row('Triggery (M=1)', s.trig)+\n      row('Rozegrane', s.N)+\n      row('Wygrane', s.W)+\n      row('Busty', s.B)+\n      row('Otwarte okna', s.open)+\n      row('WR', s.wr.toFixed(1)+'%')+\n      row('PnL', (s.pnl>=0?'+':'')+s.pnl+' zł');\n    b.appendChild(d);\n  });\n  const sc=model.stats('T1 +8'), sd=model.stats('T1 +9');\n  const combo=document.createElement('div'); combo.className='stat';\n  const cn=sc.N+sd.N, cw=sc.W+sd.W, cb=sc.B+sd.B, cp=sc.pnl+sd.pnl;\n  combo.innerHTML='<h3>COMBO (+8 &amp; +9)<\/h3>'+\n    row('Rozegrane', cn)+row('Wygrane', cw)+row('Busty', cb)+\n    row('WR', (cn?100*cw/cn:0).toFixed(1)+'%')+\n    row('PnL combo', (cp>=0?'+':'')+cp+' zł');\n  b.appendChild(combo);\n  const bs=model.baseState;\n  const d=document.createElement('div'); d.className='stat';\n  d.innerHTML='<h3>Baza (parser V1.3)<\/h3>'+\n    row('Kodów', model.N)+\n    row('Cykli WIN', bs.cyclesClosed)+\n    row('Cykl otwarty', bs.openAttempts>0?('tak, K='+bs.curK):'nie')+\n    row('Nowe kody (>baza)', Math.max(0, model.N-SEED_LEN))+\n    row('Zapis lokalny', canStore?'działa':'NIE działa');\n  b.appendChild(d);\n  const v=document.createElement('div');\n  v.style.cssText='text-align:center;color:var(--dim);font-size:11px;margin:14px 0 4px;line-height:1.6';\n  v.innerHTML='TROJKA xx1 V1.3 · wersja <b style=\"color:var(--gold)\">'+APP_VER+'<\/b> · '+APP_DATE+\n              '<br>silnik zero-diff: role/K/+8/+9 = 0 na '+SEED_LEN+' kodach';\n  b.appendChild(v);\n}\nconst row=(k,v)=>'<div><span style=\"color:var(--dim);font-weight:400\">'+k+'<\/span><span>'+v+'<\/span><\/div>';\n\n/* ============================================================\n   RENDER ALL\n   ============================================================ */\nfunction renderHint(){\n  $('hint').innerHTML='Kodów: <b>'+model.N+'<\/b> · Cykli WIN: <b>'+model.baseState.cyclesClosed+'<\/b>';\n}\nfunction renderAll(keep){\n  renderHint();\n  if(view==='gra') renderGra();\n  else if(view==='tab') renderTable(keep!==false);\n  else if(view==='stats') renderStats();\n}\n\n/* ============================================================\n   INPUT — dodawanie kodu + wzbogacony toast\n   ============================================================ */\nfunction describeCodeEffect(prevState, addedCode){\n  /* Bierzemy PRZE  () => { p.remove(); c.go(); };\n    p.querySelectorAll('.ug-st.j').forEach(el => el.onclick = () => { p.remove(); c.go(+el.dataset.er); });\n    document.body.appendChild(p);\n  }\n\n  // kolejność: w karcie linie wg pilności; karty i sekcje — najpierw GRA na następnym wierszu\n  const topP = c => Math.min(...c.lines.map(l => l.p));\n  function order(sections) {\n    sections.forEach(s => {\n      s.cards.forEach(c => { c.lines = c.lines.map((l, i) => [l, i]).sort((a, b) => a[0].p - b[0].p || a[1] - b[1]).map(x => x[0]); });\n      s.cards = s.cards.map((c, i) => [c, i]).sort((a, b) => topP(a[0]) - topP(b[0]) || a[1] - b[1]).map(x => x[0]);\n    });\n    return sections.map((s, i) => [s, i]).sort((a, b) => {\n      const pa = a[0].cards.length ? topP(a[0].cards[0]) : 9, pb = b[0].cards.length ? topP(b[0].cards[0]) : 9;\n      return (pa === 1 ? 0 : 1) - (pb === 1 ? 0 : 1) || a[1] - b[1];\n    }).map(x => x[0]);\n  }\n  function render(host, cfg) {\n    cfg.sections = order(cfg.sections);\n    const all = [].concat(...cfg.sections.map(s => s.cards));\n    const bets = [];\n    all.forEach(c => c.lines.forEach(l => { if (l.p === 1) bets.push({ id: c.id, l }); }));\n    const sum = bets.reduce((a, b) => a + (b.l.stake || 0), 0);\n    const cond = all.filter(c => c.lines.some(l => l.p === 2)).length;\n    const NX = cfg.N + 1, fmt = n => n.toLocaleString('pl-PL');\n    let h = `<div class=\"ug\">${cfg.top || ''}`;\n    h += bets.length\n      ? `<div class=\"ug-ban bet\"><div class=\"big\">▼ NASTĘPNY WIERSZ Nr ${fmt(NX)} = GRA<\/div><div class=\"sub\">${bets.length} × · razem ${fmt(sum)} zł · ${bets.map(b => esc(b.id)).join(' · ')}<\/div><\/div>`\n      : `<div class=\"ug-ban idle\"><div><b>Bez gry na Nr ${fmt(NX)}<\/b>${cond ? ` · gra w toku: ${cond}` : ''}<\/div>${cfg.idleSub ? `<div class=\"sub\">${esc(cfg.idleSub)}<\/div>` : ''}<\/div>`;\n    if (cfg.note) h += `<div class=\"ug-note\">${cfg.note}<\/div>`;\n    h += `<div class=\"ug-hint\">Tapnij kartę → tabela modelu · przytrzymaj → wszystkie etykiety<\/div>`;\n    let ci = 0; const idx = [];\n    cfg.sections.forEach(s => {\n      const sb = s.cards.reduce((a, c) => a + c.lines.filter(l => l.p === 1).length, 0);\n      const ss = s.cards.reduce((a, c) => a + c.lines.filter(l => l.p === 1).reduce((x, l) => x + (l.stake || 0), 0), 0);\n      h += `<div class=\"ug-sec\"><div class=\"ug-sh\"><b>${s.name ? esc(s.name) : `NASTĘPNY WIERSZ Nr ${fmt(NX)}`}<\/b><span class=\"${sb ? 'g' : 'm'}\">${sb ? `GRA ${sb} × · ${fmt(ss)} zł` : 'bez gry'}<\/span><\/div>`;\n      s.cards.forEach(c => {\n        const top = Math.min(...c.lines.map(l => l.p));\n        const shown = c.lines.slice(0, 2), more = c.lines.length - shown.length;\n        h += `<div class=\"ug-mc b${top}\" data-c=\"${ci}\"><div class=\"h\"><span class=\"id\">${esc(c.id)}<\/span><span class=\"rule\">${esc(c.rule || '')}<span class=\"go\" data-go=\"${ci}\">› tabela<\/span><\/span><\/div>\n          ${shown.map(l => lineHtml(l, false)).join('')}${more > 0 ? `<div class=\"more\">+ ${more} ${more === 1 ? 'etykieta' : more < 5 ? 'etykiety' : 'etykiet'} · przytrzymaj<\/div>` : ''}${metaHtml(c.meta)}<\/div>`;\n        idx.push(c); ci++;\n      });\n      h += `<\/div>`;\n    });\n    if (cfg.last && cfg.last.length) h += `<div class=\"ug-last\">Ostatnie: ${cfg.last.map(c => `<b>${esc(c)}<\/b>`).join('')}<\/div>`;\n    h += `<\/div>`;\n    host.innerHTML = h;\n    if (cfg.bindTop) cfg.bindTop(host);\n    // tapnięcie karty / linii / strzałki → TABELA (linia z Nr → ten wiersz); przytrzymanie karty → okno ze wszystkimi etykietami\n    host.querySelectorAll('.ug-mc').forEach(el => {\n      const c = idx[+el.dataset.c];\n      let t = null, long = false, x0 = 0, y0 = 0;\n      const cancel = () => { clearTimeout(t); t = null; el.classList.remove('hold'); };\n      el.addEventListener('pointerdown', e => {\n        long = false; x0 = e.clientX; y0 = e.clientY; el.classList.add('hold');\n        t = setTimeout(() => { long = true; el.classList.remove('hold'); if (navigator.vibrate) navigator.vibrate(25); popup(c); }, 450);\n      });\n      el.addEventListener('pointermove', e => { if (t && (Math.abs(e.clientX - x0) > 10 || Math.abs(e.clientY - y0) > 10)) cancel(); });\n      ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => el.addEventListener(ev, cancel));\n      el.addEventListener('contextmenu', e => e.preventDefault());\n      el.addEventListener('click', e => {\n        if (long) { long = false; e.preventDefault(); return; }\n        const st = e.target.closest('.ug-st[data-er]');\n        c.go(st ? +st.dataset.er : undefined);\n      });\n    });\n  }\n  return { render, popup };\n})();\n<\/script>\n<script>// ===== T60 RAZEM — nakładka TRÓJKA xx1 V1.3 =====\n(function () {\n  const $t = () => document.getElementById('toast');\n\n  function sync() { codes = load(); recompute(); renderAll(false); }\n  function add(c) {\n    $('codeInput').value = c; $t().innerHTML = '';\n    addCodeFromInput();\n    return $t().innerHTML;\n  }\n  function undo1() { window.__t60auto = true; try { undo(); } finally { window.__t60auto = false; } }\n\n  // NASTĘPNY WIERSZ — fazy okien jak w zakładce GRA tej apki (bez dopisywania stawek)\n  function lines() {\n    const sections = BRANCHES.map(b => {\n      const info = branchStateForNext(b.name);\n      const L = info.map(w => ({\n        id: b.name, er: w.eventEr,\n        p: w.cls === 'now' ? 2 : w.cls === 'hot' ? 4 : 5,\n        key: w.cls === 'now' ? 'GRA' : w.cls === 'hot' ? 'TRIG_PEND' : 'offset',\n        txt: `#${w.tn} · ${w.phase}`, sub: w.hint,\n      }));\n      if (!L.length) L.push({ id: b.name, er: model.N, p: 6, key: 'wait', txt: 'brak otwartych okien · czeka na TRIGGER (WIN M=1)', sub: `gra na cyklu T${b.grid}` });\n      L.sort((a, b2) => a.p - b2.p);\n      return { name: '', items: [Object.assign({ more: L.slice(1, 3) }, L[0])] };\n    });\n    const h = grayNextEventHint();\n    const trig = h && /nowy TRIGGER/.test(h) ? [['xx1', B   const st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);

  const lineHtml = (l, pop) => `<div class="ug-st p${l.p}${pop && l.er ? ' j' : ''}"${l.er ? ` data-er="${l.er}"` : ''}>${pop && l.er ? `<span class="jr">Nr ${l.er} ›<\/span>` : ''}${esc(l.txt)}${l.sub ? `<span class="s">${esc(l.sub)}<\/span>` : ''}<\/div>`;
  const metaHtml = m => m ? `<div class="meta"><span>${esc(m[0])}<\/span><span class="${/^\+/.test(m[1]) ? 'pos' : /^[−-]/.test(m[1]) ? 'neg' : ''}">${esc(m[1])}<\/span><\/div>` : '';

  function popup(c) {
    const p = document.createElement('div'); p.className = 'ug-pop';
    p.innerHTML = `<div class="sh"><button class="x">✕<\/button><h3>${esc(c.id)}<\/h3><div class="hs">${esc(c.rule || '')}<\/div>
      ${c.lines.map(l => lineHtml(l, true)).join('')}${metaHtml(c.meta)}<button class="gobtn">› TABELA ${esc(c.id)}<\/button><\/div>`;
    p.onclick = e => { if (e.target === p || e.target.classList.contains('x')) p.remove(); };
    p.querySelector('.gobtn').onclick = () => { p.remove(); c.go(); };
    p.querySelectorAll('.ug-st.j').forEach(el => el.onclick = () => { p.remove(); c.go(+el.dataset.er); });
    document.body.appendChild(p);
  }

  // kolejność: w karcie linie wg pilności; karty i sekcje — najpierw GRA na następnym wierszu
  const topP = c => Math.min(...c.lines.map(l => l.p));
  function order(sections) {
    sections.forEach(s => {
      s.cards.forEach(c => { c.lines = c.lines.map((l, i) => [l, i]).sort((a, b) => a[0].p - b[0].p || a[1] - b[1]).map(x => x[0]); });
      s.cards = s.cards.map((c, i) => [c, i]).sort((a, b) => topP(a[0]) - topP(b[0]) || a[1] - b[1]).map(x => x[0]);
    });
    return sections.map((s, i) => [s, i]).sort((a, b) => {
      const pa = a[0].cards.length ? topP(a[0].cards[0]) : 9, pb = b[0].cards.length ? topP(b[0].cards[0]) : 9;
      return (pa === 1 ? 0 : 1) - (pb === 1 ? 0 : 1) || a[1] - b[1];
    }).map(x => x[0]);
  }
  function render(host, cfg) {
    cfg.sections = order(cfg.sections);
    const all = [].concat(...cfg.sections.map(s => s.cards));
    const bets = [];
    all.forEach(c => c.lines.forEach(l => { if (l.p === 1) bets.push({ id: c.id, l }); }));
    const sum = bets.reduce((a, b) => a + (b.l.stake || 0), 0);
    const cond = all.filter(c => c.lines.some(l => l.p === 2)).length;
    const NX = cfg.N + 1, fmt = n => n.toLocaleString('pl-PL');
    let h = `<div class="ug">${cfg.top || ''}`;
    h += bets.length
