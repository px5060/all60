 localStorage.setItem(k, v); return true; } catch (e) { return false; } }\n\nlet added = [];\n(function load() {\n  const s = lsGet(LS_ADDED, '');\n  if (/^(\\d{3})*$/.test(s)) for (let i = 0; i < s.length; i += 3) added.push(s.substr(i, 3));\n})();\nfunction saveAdded() {\n  if (!lsSet(LS_ADDED, added.join(''))) alert('BŁĄD zapisu pamięci telefonu — zrób eksport JSON!');\n}\ntry { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}\n\nconst CODES16 = [];\nfor (const a of '0123') for (const b of '01') for (const c of '01') CODES16.push(a + b + c);\n\nlet codes = [], results = [], plans = null;\nfunction recompute() {\n  codes = seedArr.concat(added);\n  results = runAll(codes);\n  plans = null;\n}\nfunction getPlans() {\n  if (!plans) plans = results.map(r => playPlan(r.model, r.res));\n  return plans;\n}\n\n// ---------------------------------------------------------------------\n// ETYKIETY GRY — kolumna \"GRA\": po KAŻDYM triggerze (historia + w toku)\n//   wiersz TRIGGER        → ▶ TRIGGER → START GRY na Nr X (+off) · K\n//   wiersze czekania      → start gry za n → Nr X\n//   wiersz przed BET      → ▼ NASTĘPNY WIERSZ = GRA x1x · K · stawka\n//   wiersz BET            → GRA x1x · K → WIN ✓ / LOSS ✗   (w toku: GRA x1x · K · stawka)\n// Krok K = progresja K8 modelu (ta sama co kolumna G w Excelu).\n// Indeksy ≥ N (przyszłe) = wiersze-duchy dla gry w toku.\n// ---------------------------------------------------------------------\nfunction playPlan(model, res) {\n  const plan = new Map();\n  const bl = model.betLabel, off = model.off;\n  const add = (trigI, betI, k, win, pending) => {\n    const stake = STAWKI[k];\n    for (let j = trigI; j <= betI; j++) {\n      let t, st, tag;\n      if (j === betI) {\n        if (pending) { t = `GRA ${bl} · K${k} · ${stake} zł`; st = 'NEXT_BET'; tag = 'G'; }\n        else { t = `GRA ${bl} · K${k} → ${win ? 'WIN ✓' : 'LOSS ✗'}`; st = win ? 'BET_WIN' : 'BET_LOSS'; tag = win ? 'W' : 'L'; }\n      } else if (j === betI - 1) {\n        t = (j === trigI ? '▶ TRIGGER · ' : '') + `▼ NASTĘPNY WIERSZ = GRA ${bl} · K${k} · ${stake} zł`;\n        st = 'NEXT_BET'; tag = '▼';\n      } else if (j === trigI) {\n        t = `▶ TRIGGER → START GRY na Nr ${betI + 1} (+${off}) · K${k}`; st = 'TRIG_PEND'; tag = 'T';\n      } else {\n        t = `start gry za ${betI - j} → Nr ${betI + 1}`; st = 'czek'; tag = String(betI - j);\n      }\n      plan.set(j, { t, st, tag, k, trigI, betI, pending });\n    }\n  };\n  for (const b of res.bets) add(b.trigI, b.betI, b.k, b.win, false);\n  if (res.pending) add(res.pending.trigI, res.pending.trigI + off, res.pending.k, null, true);\n  return plan;\n}\n\nfunction shortTag(r, p) {\n  if (p) return { tag: p.tag, st: p.st };\n  switch (r.role) {\n    case 'wait': return { tag: '·', st: 'wait' };\n    case 'HIT': return { tag: 'H' + r.n, st: r.n === 1 ? 'HIT' : 'HIT' + Math.min(r.n, 4) };\n    case 'RESET': return { tag: 'R', st: 'RESET' };\n    case 'OPEN': return { tag: 'OP', st: 'OPEN' };\n    case 'skip': return { tag: 's', st: 'skip' };\n    default: return { tag: '?', st: 'wait' };\n  }\n}\nconst sty = key => { const s = STYLES[key] || STYLES.wait; return `background:${s.fill};color:${s.font};${s.bold ? 'font-weight:700;' : ''}`; };\nconst esc = s => String(s).replace(/[&<>\"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;' }[c]));\nconst fmtN = v => String(v).replace(/\\B(?=(\\d{3})+(?!\\d))/g, ' ');\n\n// ---------------------------------------------------------------------\n// WIDOKI\n// ---------------------------------------------------------------------\nlet view = 'gra', tabSel = 'ALL', tabLimit = 80, statMC = null, tabScroll = null;\nconst $main = document.getElementById('main');\n\nfunction nextBets() {\n  return results.filter(x => x.res.pending && x.res.pending.betIn === 1)\n                .map(x => ({ id: x.model.id, k: x.res.pending.k, stake: STAWKI[x.res.pending.k], bl: x.model.betLabel }));\n}\n\nfunction renderGra() {\n  const N = codes.length, NX = N + 1;\n  const nb = nextBets();\n  // --- tablica NASTĘPNY WIERSZ: jedna linia na model ---\n  const lines = results.map(({ model: m, res, live }) => {\n    const p = res.pending;\n    if (p && p.betIn === 1)\n      return { key: 'NEXT_BET', ord: 0, txt: `▼ GRA ${m.betLabel} · K${p.k} · ${STAWKI[p.k]} zł`, sub: `trigger Nr ${p.trigI + 1} (+${m.off})` };\n    if (p)\n      return { key: 'TRIG_PEND', ord: 1, txt: `gra za ${p.betIn} → Nr ${p.trigI + m.off + 1} · K${p.k}`, sub: `trigger Nr ${p.trigI + 1}` };\n    if (res.state === 'open')\n      return { key: 'czek', ord: 2, txt: `trigger jeśli wpadnie ${m.trigLabel}`, sub: `→ gra na Nr ${NX + m.off} · K${res.nextK}` };\n    if (live.type === 'COUNTING')\n      return { key: 'wait', ord: 3, txt: `brak · HIT ${live.hits}/${m.min}`, sub: m.stepLabel };\n    return { key: 'wait', ord: 4, txt: 'brak · czeka na STEP', sub: `${m.min}× ${m.stepLabel}` };\n  });\n  const sum = nb.reduce((a, b) => a + b.stake, 0);\n  let h = `<div class=\"card nxt\"><div class=\"nxh\"><span>NASTĘPNY WIERSZ <b>Nr ${NX}<\/b><\/span>\n    <span class=\"${nb.length ? 'nxbet' : 'muted'}\">${nb.length ? `GRA: ${nb.length} × · ${sum} zł` : 'bez gry'}<\/span><\/div>\n    ${results.map((x, i) => { const l = lines[i]; return `<div class=\"nxl${l.key === 'NEXT_BET' ? ' bet' : ''}\" style=\"${sty(l.key)}\"><b class=\"nxid\">${x.model.id}<\/b><span class=\"nxt1\">${esc(l.txt)}<\/span><span class=\"nxs\">${esc(l.sub)}<\/span><\/div>`; }).join('')}\n  <\/div>`;\n  h += `<div class=\"last\">Ostatnie: ${codes.slice(-8).map(c => `<b>${c}<\/b>`).join('')}<\/div>`;\n  $main.innerHTML = h;\n  // podpowiedź pod polem: które kody dadzą TRIGGER\n  const openM = results.filter(x => x.res.state === 'open');\n  const tr = CODES16.map(c => [c, openM.filter(x => match(c, x.model.trig)).map(x => x.model.id)]).filter(x => x[1].length);\n  document.getElementById('eHint').innerHTML = tr.length\n    ? 'TRIGGER da: ' + tr.map(([c, ids]) => `<b>${c}<\/b> → ${ids.join(',')}`).join(' · ')\n    : 'Żaden kod w następnym wierszu nie da teraz triggera.';\n}\n\nfunction renderTab() {\n  const N = codes.length;\n  const P = getPlans();\n  let h = `<div class=\"chips stick\">${['ALL', ...MODELS.map(m => m.id)].map(id => `<button data-m=\"${id}\" class=\"${tabSel === id ? 'on' : ''}\">${id === 'ALL' ? 'WSZ' : id}<\/button>`).join('')}<\/div>`;\n  const from = Math.max(0, N - tabLimit);\n  if (from > 0) h += `<div class=\"row\" style=\"margin:0 0 8px\"><button class=\"btn\" id=\"more\">▲ Pokaż +200 wcześniejszych wierszy (teraz ${Math.min(tabLimit, N)})<\/button><\/div>`;\n  if (tabSel === 'ALL') {\n    let maxGhost = N - 1;\n    results.forEach(x => { if (x.res.pending) maxGhost = Math.max(maxGhost, x.res.pending.trigI + x.model.off); });\n    h += `<div class=\"tw\" id=\"tw\"><table><thead><tr><th>Nr<\/th><th>Kod<\/th>${MODELS.map(m => `<th style=\"text-align:center\">${m.id}<\/th>`).join('')}<\/tr><\/thead><tbody>`;\n    for (let i = from; i <= maxGhost; i++) {\n      const ghost = i >= N;\n      let cells = '', gra = [];\n      for (let mi = 0; mi < results.length; mi++) {\n        const p = P[mi].get(i);\n        if (ghost && !p) { cells += '<td class=\"mini\"><\/td>'; continue; }\n        const s = shortTag(results[mi].res.rows[i], p);\n        cells += `<td class=\"mini\" style=\"${sty(s.st)}\">${esc(s.tag)}<\/td>`;\n        if (p && (p.st === 'NEXT_BET' || p.st === 'TRIG_PEND' || p.st === 'BET_WIN' || p.st === 'BET_LOSS'))\n          gra.push(`<span class=\"gc\" style=\"${sty(p.st)}\">${MODELS[mi].id} ${esc(p.st === 'TRIG_PEND' ? `▶ gra Nr ${p.betI + 1}` : p.st === 'NEXT_BET' ? (p.betI === i ? `GRA K${p.k} ${STAWKI[p.k]} zł` : `▼ nast. GRA K${p.k}`) : `${p.tag === 'W' ? 'WIN' : 'LOSS'} K${p.k}`)}<\/span>`);\n      }\n      h += `<tr class=\"${ghost ? 'ghost' : ''}\"><td class=\"nr\">${i + 1}<\/td><td class=\"c\">${ghost ? (i === N ? 'nast.' : '…') : codes[i]}<\/td>${cells}<\/tr>${gra.length ? `<tr class=\"grarow${ghost ? ' ghost' : ''}\"><td><\/td><td colspan=\"${MODELS.length + 1}\">${gra.join('')}<\/td><\/tr>` : ''}`;\n    }\n    h += `<\/tbody><\/table><\/div>`;\n  } else {\n    const mi = MODELS.findIndex(m => m.id === tabSel);\n    const m = MODELS[mi], res = results[mi].res, p = P[mi];\n    h += `<div class=\"muted\" style=\"margin-bottom:6px\">${m.id}: ${m.min}× ${m.stepLabel} → trigger ${m.trigLabel} → BET ${m.betLabel} na +${m.off} · K8<\/div>`;\n    const last = res.pending ? res.pending.trigI + m.off : N - 1;\n    h += `<div class=\"tw\" id=\"tw\"><table><thead><tr><th>Nr<\/th><th>Kod<\/th><th>GRA<\/th><th>Stan/Rola<\/th><th>#<\/th><th>Para<\/th><th>Krok<\/th><\/tr><\/thead><tbody>`;\n    for (let i = from; i <= last; i++) {\n      const pe = p.get(i);\n      const graTd = pe ? `<td class=\"gra\" style=\"${sty(pe.st)}\">${esc(pe.t)}<\/td>` : '<td class=\"gra\"><\/td>';\n      if (i >= N) {\n        h += `<tr class=\"ghost\"><td class=\"nr\">${i + 1}<\/td><td class=\"c\">${i === N ? 'nast.' : '…'}<\/td>${graTd}<td colspan=\"4\" class=\"muted\">${i === N ? 'następny kod' : 'przyszły kod'}<\/td><\/tr>`;\n        continue;\n      }\n      const v = rowView(m, res.rows[i]);\n      h += `<tr><td class=\"nr\">${i + 1}<\/td><td class=\"c\">${codes[i]}<\/td>${graTd}<td class=\"rola\" style=\"${sty(v.styleKey)}\">${esc(v.rola)}<\/td><td>${v.num ?? ''}<\/td><td>${v.para ?? ''}<\/td><td>${v.krok ?? ''}<\/td><\/tr>`;\n    }\n    h += `<\/tbody><\/table><\/div>`;\n  }\n  h += `  <div class=\"legend\">Kolumna <b>GRA<\/b>:\n  <span style=\"${sty('TRIG_PEND')}\">T ▶ TRIGGER → start gry<\/span>\n  <span style=\"${sty('czek')}\">3 2 … za ile wierszy<\/span>\n  <span style=\"${sty('NEXT_BET')}\">▼ następny wiersz = GRA<\/span>\n  <span style=\"${sty('BET_WIN')}\">W<\/span><span style=\"${sty('BET_LOSS')}\">L<\/span> wynik gry.\n  Pozostałe: <span style=\"${sty('HIT')}\">H1<\/span> HIT n · <span style=\"${sty('OPEN')}\">OP<\/span> STEP OPEN · <span style=\"${sty('skip')}\">s<\/span> skip · <span style=\"${sty('RESET')}\">R<\/span> RESET · · wait.\n  Wiersze przerywane = przyszłe kody gry w toku.<\/div>`;\n  $main.innerHTML = h;\n  $main.querySelectorAll('.chips button').forEach(b => b.onclick = () => { tabSel = b.dataset.m; tabLimit = 80; tabScroll = 'end'; render(); });\n  const mb = document.getElementById('more');\n  if (mb) mb.onclick = () => { tabLimit += 200; tabScroll = document.documentElement.scrollHeight - window.scrollY; render(); };\n  const tw = document.getElementById('tw');\n  requestAnimationFrame(() => {\n    if (tabScroll === 'end') {                       // ostatni wiersz (z przyszłymi wierszami gry) nad dolnym paskiem\n      const last = tw.querySelector('tbody tr:last-child');\n      const navH = document.querySelector('nav').offsetHeight;\n      const y = last.getBoundingClientRect().bottom + window.scrollY - (window.innerHeight - navH) + 12;\n      window.scrollTo(0, Math.max(0, y));\n    } else if (typeof tabScroll === 'number') {       // po „wcześniejsze wiersze” zostań w tym samym miejscu\n      window.scrollTo(0, document.documentElement.scrollHeight - tabScroll);\n    }\n    tabScroll = null;\n  });\n}\n\nfunction renderStat() {\n  const stats = results.map(x => computeStats(codes, x.res, x.model, statMC ? { mc: true } : {}));\n  let h = `<div class=\"card\"><h2>Zestawienie — ${fmtN(codes.length)} kodów<\/h2><div class=\"tw\"><table><thead><tr><th>Model<\/th><th>Trig/WIN<\/th><th>WR%<\/th><th>maxL<\/th><th>Busty<\/th><th>Bilans<\/th><th>WF<\/th><\/tr><\/thead><tbody>`;\n  stats.forEach((s, i) => { h += `<tr><td><b>${MODELS[i].id}<\/b><\/td><td>${s.trig}/${s.win}<\/td><td>${s.wr.toFixed(1)}<\/td><td>${s.maxloss}<\/td><td>${s.busty}<\/td><td style=\"color:${s.bilans >= 0 ? '#5fd38a' : '#ff8a8a'}\">${s.bilans >= 0 ? '+' : ''}${fmtN(s.bilans)}<\/td><td>${s.wf}/5<\/td><\/tr>`; });\n  const tot = stats.reduce((a, s) => a + s.bilans, 0);\n  h += `<tr><td><b>Σ<\/b><\/td><td colspan=\"4\"><\/td><td><b>${tot >= 0 ? '+' : ''}${fmtN(tot)}<\/b><\/td><td><\/td><\/tr><\/tbody><\/table><\/div>\n  <div class=\"row\"><button class=\"btn\" id=\"mc\">${statMC ? 'Ukryj Monte-Carlo' : 'Policz Monte-Carlo (bootstrap/permutacja)'}<\/button><\/div><\/div>`;\n  stats.forEach((s, i) => {\n    const m = MODELS[i], pt = panelText(s);\n    h += `<div class=\"card\"><h2>${m.id} · ${m.min}× ${m.stepLabel} → ${m.trigLabel} → x1x +${m.off}<\/h2><table class=\"stt\"><tbody>${Object.entries(pt).map(([k, v]) => `<tr><td>${k}<\/td><td>${esc(v)}<\/td><\/tr>`).join('')}<\/tbody><\/table><\/div>`;\n  });\n  $main.innerHTML = h;\n  document.getElementById('mc').onclick = () => { statMC = !statMC; render(); };\n}\n\nfunction renderDane() {\n  const auto = lsGet(LS_AUTOBK, '1') === '1';\n  $main.innerHTML = `<div class=\"card\"><h2>Dane<\/h2>\n  <table class=\"stt\"><tbody>\n  <tr><td>Kody razem<\/td><td><b>${fmtN(codes.length)}<\/b><\/td><\/tr>\n  <tr><td>w tym z pliku (seed)<\/td><td>${fmtN(SEED_N)}<\/td><\/tr>\n  <tr><td>dopisane / zaimportowane<\/td><td><b>${added.length}<\/b><\/td><\/tr>\n  <tr><td>ostatni import<\/td><td>${esc(lsGet(LS_LASTIMP, '—'))}<\/td><\/tr>\n  <tr><td>ostatni backup przy n<\/td><td>${lsGet(LS_LASTBK, '—')}<\/td><\/tr>\n  <tr><td>wersja<\/td><td>${APP_VER}<\/td><\/tr><\/tbody><\/table>\n  <div class=\"row\"><button class=\"btn pik\" id=\"impP\">⬆ Import kodów z Pikoff 60 (.json)<\/button><\/div>\n  <div class=\"row\"><button class=\"btn pri\" id=\"exp\">⬇ Eksport JSON (do Excela)<\/button><\/div>\n  <div class=\"row\"><button class=\"btn\" id=\"imp\">⬆ Import kopii TOP5 (.json)<\/button><\/div>\n  <label class=\"sw\"><input type=\"checkbox\" id=\"auto\" ${auto ? 'checked' : ''}> Auto-backup JSON co 10 kodów<\/label>\n  <div class=\"row\"><button class=\"btn warn\" id=\"rst\">Usuń dopisane kody (wróć do seed)<\/button><\/div>\n  <div class=\"row\"><button class=\"btn\" id=\"self\">Test zgodności silnika<\/button><\/div>\n  <div class=\"muted\" id=\"selfOut\" style=\"margin-top:6px\"><\/div><\/div>\n  <div class=\"card muted\"><b>Pikoff 60:<\/b> w Pikoff zrób eksport kopii (.json, plik <b>xx1_pikoff_*.json<\/b>), tu „Import kodów z Pikoff 60” i wybierz ten plik. Apka sprawdzi, czy początek ciągu się zgadza, i weźmie tylko nowe kody.<br><br>\n  <b>Excel:<\/b> plik JSON z Pobranych → <b>apka_top5_do_excela.bat<\/b> (dopisuje kody do M1 kol. C i od razu uruchamia dopisz_top5_x1x — wszystkie 5 arkuszy + ZESTAWIENIE).<\/div>`;\n  document.getElementById('exp').onclick = () => exportJSON(false);\n  document.getElementById('imp').onclick = () => { impMode = 'top5'; document.getElementById('fileIn').click(); };\n  document.getElementById('impP').onclick = () => { impMode = 'pikoff'; document.getElementById('fileIn').click(); };\n  document.getElementById('auto').onchange = e => lsSet(LS_AUTOBK, e.target.checked ? '1' : '0');\n  document.getElementById('rst').onclick = () => {\n    if (!added.length) return;\n    if (!confirm(`Usunąć ${added.length} dopisanych kodów? Najpierw zrób eksport JSON!`)) return;\n    if (!confirm('Na pewno? Tego nie da się cofnąć.')) return;\n    added = []; saveAdded(); recompute(); render();\n  };\n  document.getElementById('self').onclick = () => {\n    const out = document.getElementById('selfOut');\n    const errs = selfTest(seedArr.slice(0, TABLE.nCodesRef));\n    out.innerHTML = !errs.length ? `✓ OK — statystyki na ${fmtN(TABLE.nCodesRef)} kodach referencyjnych zgodne z plikiem (5 modeli)` : '✗ ' + errs.map(esc).join('<br>');\n  };\n}\n\nfunction render() {\n  document.getElementById('hdrN').textContent = `n=${fmtN(codes.length)}${added.length ? ` (+${added.length})` : ''}`;\n  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === view));\n  document.getElementById('entry').style.display = view === 'gra' ? '' : 'none';\n  ({ gra: renderGra, tab: renderTab, stat: renderStat, dane: renderDane })[view]();\n}\n\n// ---------------------------------------------------------------------\n// AKCJE\n// ---------------------------------------------------------------------\nlet toastT = null;\nfunction toast(html, ms = 3500) {\n  const t = document.getElementById('toast');\n  t.innerHTML = html; t.classList.add('on');\n  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), ms);\n}\n\nfunction addCode(c) {\n  c = normalizeCode(c); if (!c) return;\n  added.push(c); saveAdded(); recompute();\n  const N = codes.length, i = N - 1, P = getPlans();\n  const msgs = [];\n  results.forEach((x, mi) => {\n    const p = P[mi].get(i);\n    if (!p) return;\n    if (p.betI === i && !p.pending) msgs.push(`<b>${x.model.id}<\/b>: GRA K${p.k} → ${p.tag === 'W' ? '<span style=\"color:#5fd38a\">WIN ✓<\/span>' : '<span style=\"color:#ff8a8a\">LOSS ✗<\/span>'}`);\n    else if (p.trigI === i) msgs.push(`<b>${x.model.id}<\/b>: ▶ TRIGGER → START GRY na Nr ${p.betI + 1} (+${x.model.off}) · K${p.k}`);\n  });\n  const nb = nextBets();\n  if (nb.length) msgs.push(`<b style=\"color:#ff9a4d\">▼ NASTĘPNY KOD = GRA x1x: ${nb.map(b => `${b.id} K${b.k} ${b.stake} zł`).join(', ')}<\/b>`);\n  toast(`Nr ${N}: <b>${c}<\/b>${msgs.length ? '<br>' + msgs.join('<br>') : ''}`, msgs.length ? 5000 : 1500);\n  if (navigator.vibrate) navigator.vibrate(nb.length ? [60, 60, 120] : 25);\n  render();\n  if (lsGet(LS_AUTOBK, '1') === '1' && added.length % 10 === 0) exportJSON(true);\n}\n\nfunction undo() {\n  if (!added.length) { toast('Brak dopisanych kodów do cofnięcia (kody z pliku są chronione).'); return; }\n  const c = added[added.length - 1];\n  if (!confirm(`Cofnąć ostatni kod Nr ${codes.length}: ${c}?`)) return;\n  added.pop(); saveAdded(); recompute(); render();\n  toast(`Cofnięto Nr ${codes.length + 1}: ${c}`);\n}\n\nfunction stamp() {\n  const d = new Date(), p = n => String(n).padStart(2, '0');\n  return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`;\n}\nfunction exportJSON(auto) {\n  const data = { kind: JSON_KIND, app: 'TOP5 x1x', version: APP_VER, table: TABLE.file,\n                 created: new Date().toISOString(), n: codes.length, seed_n: SEED_N, codes };\n  const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });\n  const a = document.createElement('a');\n  a.href = URL.createObjectURL(blob);\n  a.download = `top5_${stamp()}_n${codes.length}.json`;\n  document.body.appendChild(a); a.click(); a.remove();\n  setTimeout(() => URL.revokeObjectURL(a.href), 5000);\n  lsSet(LS_LASTBK, String(codes.length));\n  toast(auto ? `Auto-backup: ${a.download}` : `Zapisano ${a.download}`);\n}\n\n// ---------------------------------------------------------------------\n// IMPORT (TOP5 kopia albo Pikoff 60)\n// Plik: {kind, codes:[...]} albo sama lista kodów. Kody \"10\"/10 → \"010\".\n// Dopasowanie do ciągu apki:\n//   1) ta sama numeracja: kody pliku = kody apki od Nr 1 (standard Pikoff/Test60)\n//   2) inna numeracja: szukam ostatnich ALIGN_TAIL kodów z pliku (seed) w pliku;\n//      tylko jedno dopasowanie + zgodna cała część wspólna → przesunięcie\n// Każda różnica w części wspólnej = STOP, nic nie zmienione.\n// ---------------------------------------------------------------------\nlet impMode = 'top5';\n\nfunction alignFile(arr) {\n  // zwraca {shift, newCodes, overlap} — shift: Nr w apce = Nr w pliku + shift\n  const n = Math.min(arr.length, SEED_N);\n  let firstDiff = -1;\n  for (let i = 0; i < n; i++) if (arr[i] !== seedArr[i]) { firstDiff = i; break; }\n  if (firstDiff < 0) {\n    if (arr.length <= SEED_N) return { shift: 0, tail: [], overlap: arr.length };\n    return { shift: 0, tail: arr.slice(SEED_N), overlap: SEED_N };\n  }\n  // numeracja inna? szukam końcówki seed w pliku\n  const tail = seedArr.slice(SEED_N - ALIGN_TAIL).join('|');\n  const hits = [];\n  for (let p = 0; p + ALIGN_TAIL <= arr.length; p++) {\n    if (arr[p] !== seedArr[SEED_N - ALIGN_TAIL]) continue;\n    if (arr.slice(p, p + ALIGN_TAIL).join('|') === tail) hits.push(p);\n  }\n  if (hits.length !== 1) {\n    throw new Error(`kody pliku różnią się od ciągu apki na Nr ${firstDiff + 1} (plik ${arr[firstDiff]}, apka ${seedArr[firstDiff]})` +\n      (hits.length > 1 ? ' i końcówka występuje w pliku kilka razy' : ' — nie znalazłem też końcówki ciągu apki w pliku'));\n  }\n  const endInFile = hits[0] + ALIGN_TAIL;            // indeks w pliku = SEED_N w apce\n  const shift = SEED_N - endInFile;\n  const startFile = Math.max(0, -shift);\n  for (let f = startFile; f < endInFile; f++) {\n    if (arr[f] !== seedArr[f + shift])\n      throw new Error(shift ? `numeracja przesunięta o ${shift}: różnica na Nr apki ${f + shift + 1} (plik Nr ${f + 1}: ${arr[f]}, apka ${seedArr[f + shift]})`\n                           : `różnica na Nr ${f + 1}: plik ${arr[f]}, apka ${seedArr[f]}`);\n  }\n  return { shift, tail: arr.slice(endInFile), overlap: endInFile - startFile };\n}\n\nfunction importFile(d, fname) {\n  const raw = Array.isArray(d) ? d : d && d.codes;\n  if (!Array.isArray(raw) || !raw.length) throw new Error('plik nie zawiera listy kodów (pole \"codes\")');\n  const kind = Array.isArray(d) ? '(lista)' : (d.kind || '?');\n  const want = impMode === 'pikoff' ? PIKOFF_KIND : JSON_KIND;\n  if (kind !== want && !confirm(`Plik ma kind=\"${kind}\", oczekiwano \"${want}\". Kontynuować?`)) return;\n  const arr = raw.map(normalizeCode);\n  const bad = arr.findIndex(x => !x);\n  if (bad >= 0) throw new Error(`nieprawidłowy kod na pozycji ${bad + 1}: ${JSON.stringify(raw[bad])}`);\n\n  const al = alignFile(arr);\n  const newAll = al.tail;                              // kody po seed wg pliku\n  // porównanie z obecnie dopisanymi\n  let same = 0;\n  while (same < Math.min(added.length, newAll.length) && added[same] === newAll[same]) same++;\n  const lose = added.length - same;                   // dopisane w apce, których plik nie ma / ma inne\n  const gain = newAll.length - same;\n  if (!gain) { toast(`Import: brak nowych kodów — plik ma ${arr.length} kodów, apka ${codes.length}${lose ? ' (plik starszy, kody z apki zostają)' : ''}.`, 5000); return; }\n\n  let msg = `Import ${impMode === 'pikoff' ? 'z Pikoff 60' : 'kopii TOP5'}: ${fname}\\n` +\n            `Plik: ${arr.length} kodów${al.shift ? ` (numeracja przesunięta o ${al.shift > 0 ? '+' : ''}${al.shift})` : ''}\\n` +\n            `Zgodna część wspólna: ${al.overlap} kodów\\n` +\n            `Apka teraz: ${codes.length} → po imporcie: ${SEED_N + newAll.length}\\n` +\n            `Nowe kody: ${gain}${gain ? ` (Nr ${SEED_N + same + 1}–${SEED_N + newAll.length})` : ''}`;\n  if (lose) msg += `\\n\\n⚠ UWAGA: ${lose} kodów wpisanych w apce (od Nr ${SEED_N + same + 1}) nie zgadza się z plikiem lub go brak — zostaną zastąpione.`;\n  if (!confirm(msg + '\\n\\nOK?')) return;\n  if (lose && !confirm(`Na pewno zastąpić ${lose} kodów z apki?`)) return;\n  added = newAll.slice(); saveAdded(); recompute();\n  lsSet(LS_LASTIMP, `${impMode === 'pikoff' ? 'Pikoff' : 'TOP5'} · ${new Date().toLocaleString('pl-PL')} · n=${codes.length} · +${gain}`);\n  render();\n  const nb = nextBets();\n  toast(`Zaimportowano: +${gain} kodów, teraz n=${codes.length}` +\n        (nb.length ? `<br><b style=\"color:#ff9a4d\">▼ NASTĘPNY KOD = GRA x1x: ${nb.map(b => `${b.id} K${b.k} ${b.stake} zł`).join(', ')}<\/b>` : ''), 6000);\n}\n\ndocument.getElementById('fileIn').onchange = e => {\n  const f = e.target.files[0]; e.target.value = '';\n  if (!f) return;\n  const rd = new FileReader();\n  rd.onload = () => {\n    try { importFile(JSON.parse(rd.result), f.name); }\n    catch (err) { alert('Import przerwany, nic nie zmieniono:\\n' + err.message); }\n  };\n  rd.readAsText(f);\n};\n\nconst $in = document.getElementById('codeIn');\nconst VALID = new Set(CODES16);\nfunction submitCode() {\n  const v = $in.value.trim();\n  if (!v) return;\n  const c = v.length === 3 ? v : null;\n  if (!c || !VALID.has(c)) {\n    $in.classList.remove('bad'); void $in.offsetWidth; $in.classList.add('bad');\n    toast(`„${esc(v)}” to nie jest kod z ciągu (1. cyfra 0–3, 2. i 3. cyfra 0–1).`);\n    $in.select(); return;\n  }\n  $in.value = ''; $in.classList.remove('bad');\n  addCode(c);\n  $in.focus();\n}\n$in.addEventListener('input', () => {\n  $in.value = $in.value.replace(/\\D/g, '').slice(0, 3);\n  $in.classList.remove('bad');\n  if ($in.value.length === 3) submitCode();          // 3 cyfry = od razu dodaj\n});\n$in.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); submitCode(); } });\ndocument.getElementById('addBtn').onclick = submitCode;\ndocument.getElementById('undo').onclick = () => { undo(); $in.focus(); };\n\ndocument.querySelectorAll('nav button').forEach(b => b.onclick = () => { view = b.dataset.v; if (view === 'tab') { tabLimit = 80; tabScroll = 'end'; } render(); if (view !== 'tab') window.scrollTo(0, 0); });\n\nfunction setHH() { document.documentElement.style.setProperty('--hh', document.querySelector('header').offsetHeight + 'px'); }\nsetHH(); window.addEventListener('resize', setHH);\nrecompute();\nrender();\n<\/script>\n<script>// ===== T60 RAZEM — nakładka wspólna (wstrzykiwana do każdej tabeli) =====\n// Nie zmienia silnika ani widoków. Wyłącza tylko: własne pole wpisu, DANE,\n// autokopie, wibrację, kradzież fokusu z pola RAZEM; dodaje API window.T60.\n(function () {\n  const _focus = HTMLElement.prototype.focus;\n  HTMLElement.prototype.focus = function () { if (window.__t60focus) return _focus.apply(this, arguments); };\n  const _conf = window.confirm.bind(window);\n  window.confirm = function (m) { return window.__t60auto ? true : _conf(m); };\n  try { Object.defineProperty(navigator, 'vibrate', { value: function () { return true; }, configurable: true }); } catch (e) {}\n})();\nwindow.__t60esc = s => String(s).replace(/[&<>\"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;' }[c]));\nwindow.__t60flash = function (tr) {\n  if (!tr) return;\n  tr.style.outline = '3px solid #ff6600'; tr.style.outlineOffset = '-3px';\n  t 600}\n.ug-st.p6{background:#1b1f2a;color:#8b93a7;font-weight:500}\n.ug-mc .more{margin-top:4px;font-size:11.5px;color:#9fc4ff;font-weight:600}\n.ug-mc .meta{margin-top:5px;color:#8b93a7;font-size:12px;display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}\n.ug-mc .meta .pos{color:#5fd38a;font-weight:700}.ug-mc .meta .neg{color:#ff8a8a;font-weight:700}\n.ug-last{display:flex;gap:5px;flex-wrap:wrap;margin:6px 2px 10px;color:#8b93a7;font-size:12px;align-items:center}\n.ug-last b{color:#e8ebf2;background:#242a38;border-radius:5px;padding:2px 6px;font-variant-numeric:tabular-nums}\n.ug-pop{position:fixed;inset:0;z-index:300;background:#000a;display:flex;align-items:flex-end}\n.ug-pop .sh{width:100%;max-height:80vh;overflow:auto;background:#1b1f2a;border-top:2px solid #ff6600;border-radius:14px 14px 0 0;padding:12px 14px 22px;color:#e8ebf2;font:14px/1.4 system-ui,sans-serif}\n.ug-pop h3{margin:0 0 2px;font-size:17px}.ug-pop .hs{color:#8b93a7;font-size:12px;margin-bottom:8px}\n.ug-pop .x{float:right;background:#242a38;border:1px solid #323a4d;color:#e8ebf2;border-radius:8px;padding:4px 10px;font-size:15px}\n.ug-pop .ug-st{cursor:default}.ug-pop .ug-st.j{cursor:pointer}\n.ug-pop .ug-st .jr{float:right;font-size:11px;opacity:.85}\n.ug-pop .meta{color:#8b93a7;font-size:12.5px;margin-top:10px;display:flex;justify-content:space-between}\n.ug-pop .gobtn{margin-top:12px;width:100%;padding:11px;border-radius:9px;border:0;background:#ff6600;color:#fff;font-weight:700;font-size:15px}`;\n  const st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);\n\n  const lineHtml = (l, pop) => `<div class=\"ug-st p${l.p}${pop && l.er ? ' j' : ''}\"${l.er ? ` data-er=\"${l.er}\"` : ''}>${pop && l.er ? `<span class=\"jr\">Nr ${l.er} ›<\/span>` : ''}${esc(l.txt)}${l.sub ? `<span class=\"s\">${esc(l.sub)}<\/span>` : ''}<\/div>`;\n  const metaHtml = m => m ? `<div class=\"meta\"><span>${esc(m[0])}<\/span><span class=\"${/^\\+/.test(m[1]) ? 'pos' : /^[−-]/.test(m[1]) ? 'neg' : ''}\">${esc(m[1])}<\/span><\/div>` : '';\n\n  function popup(c) {\n    const p = document.createElement('div'); p.className = 'ug-pop';\n    p.innerHTML = `<div class=\"sh\"><button class=\"x\">✕<\/button><h3>${esc(c.id)}<\/h3><div class=\"hs\">${esc(c.rule || '')}<\/div>\n      ${c.lines.map(l => lineHtml(l, true)).join('')}${metaHtml(c.meta)}<button class=\"gobtn\">› TABELA ${esc(c.id)}<\/button><\/div>`;\n    p.onclick = e => { if (e.target === p || e.target.classList.contains('x')) p.remove(); };\n    p.querySelector('.gobtn').onclick = () => { p.remove(); c.go(); };\n    p.querySelectorAll('.ug-st.j').forEach(el => el.onclick = () => { p.remove(); c.go(+el.dataset.er); });\n    document.body.appendChild(p);\n  }\n\n  // kolejność: w karcie linie wg pilności; karty i sekcje — najpierw GRA na następnym wierszu\n  const topP = c => Math.min(...c.lines.map(l => l.p));\n  function order(sections) {\n    sections.forEach(s => {\n      s.cards.forEach(c => { c.lines = c.lines.map((l, i) => [l, i]).sort((a, b) => a[0].p - b[0].p || a[1] - b[1]).map(x => x[0]); });\n      s.cards = s.cards.map((c, i) => [c, i]).sort((a, b) => topP(a[0]) - topP(b[0]) || a[1] - b[1]).map(x => x[0]);\n    });\n    return sections.map((s, i) => [s, i]).sort((a, b) => {\n      const pa = a[0].cards.length ? topP(a[0].cards[0]) : 9, pb = b[0].cards.length ? topP(b[0].cards[0]) : 9;\n      return (pa === 1 ? 0 : 1) - (pb === 1 ? 0 : 1) || a[1] - b[1];\n    }).map(x => x[0]);\n  }\n  function render(host, cfg) {\n    cfg.sections = order(cfg.sections);\n    const all = [].concat(...cfg.sections.map(s => s.cards));\n    const bets = [];\n    all.forEach(c => c.lines.forEach(l => { if (l.p === 1) bets.push({ id: c.id, l }); }));\n    const sum = bets.reduce((a, b) => a + (b.l.stake || 0), 0);\n    const cond = all.filter(c => c.lines.some(l => l.p === 2)).length;\n    const NX = cfg.N + 1, fmt = n => n.toLocaleString('pl-PL');\n    let h = `<div class=\"ug\">${cfg.top || ''}`;\n    h += bets.length\n      ? `<div class=\"ug-ban bet\"><div class=\"big\">▼ NASTĘPNY WIERSZ Nr ${fmt(NX)} = GRA<\/div><div class=\"sub\">${bets.length} × · razem ${fmt(sum)} zł · ${bets.map(b => esc(b.id)).join(' · ')}<\/div><\/div>`\n      : `<div class=\"ug-ban idle\"><div><b>Bez gry na Nr ${fmt(NX)}<\/b>${cond ? ` · gra w toku: ${cond}` : ''}<\/div>${cfg.idleSub ? `<div class=\"sub\">${esc(cfg.idleSub)}<\/div>` : ''}<\/div>`;\n    if (cfg.note) h += `<div class=\"ug-note\">${cfg.note}<\/div>`;\n    h += `<div class=\"ug-hint\">Tapnij kartę → tabela modelu · przytrzymaj → wszystkie etykiety<\/div>`;\n    let ci = 0; const idx = [];\n    cfg.sections.forEach(s => {\n      const sb = s.cards.reduce((a, c) => a + c.lines.filter(l => l.p === 1).length, 0);\n      const ss = s.cards.reduce((a, c) => a + c.lines.filter(l => l.p === 1).reduce((x, l) => x + (l.stake || 0), 0), 0);\n      h += `<div class=\"ug-sec\"><div class=\"ug-sh\"><b>${s.name ? esc(s.name) : `NASTĘPNY WIERSZ Nr ${fmt(NX)}`}<\/b><span class=\"${sb ? 'g' : 'm'}\">${sb ? `GRA ${sb} × · ${fmt(ss)} zł` : 'bez gry'}<\/span><\/div>`;\n      s.cards.forEach(c => {\n        const top = Math.min(...c.lines.map(l => l.p));\n        const shown = c.lines.slice(0, 2), more = c.lines.length - shown.length;\n        h += `<div class=\"ug-mc b${top}\" data-c=\"${ci}\"><div class=\"h\"><span class=\"id\">${esc(c.id)}<\/span><span class=\"rule\">${esc(c.rule || '')}<span class=\"go\" data-go=\"${ci}\">› tabela<\/span><\/span><\/div>\n          ${shown.map(l => lineHtml(l, false)).join('')}${more > 0 ? `<div class=\"more\">+ ${more} ${more === 1 ? 'etykieta' : more < 5 ? 'etykiety' : 'etykiet'} · przytrzymaj<\/div>` : ''}${metaHtml(c.meta)}<\/div>`;\n        idx.push(c); ci++;\n      });\n      h += `<\/div>`;\n    });\n    if (cfg.last && cfg.last.length) h += `<div class=\"ug-last\">Ostatnie: ${cfg.last.map(c => `<b>${esc(c)}<\/b>`).join('')}<\/div>`;\n    h += `<\/div>`;\n    host.innerHTML = h;\n    if (cfg.bindTop) cfg.bindTop(host);\n    // tapnięcie karty / linii / strzałki → TABELA (linia z Nr → ten wiersz); przytrzymanie karty → okno ze wszystkimi etykietami\n    host.querySelectorAll('.ug-mc').forEach(el => {\n      const c = idx[+el.dataset.c];\n      let t = null, long = false, x0 = 0, y0 = 0;\n      const cancel = () => { clearTimeout(t); t = null; el.classList.remove('hold'); };\n      el.addEventListener('pointerdown', e => {\n        long = false; x0 = e.clientX; y0 = e.clientY; el.classList.add('hold');\n        t = setTimeout(() => { long = true; el.classList.remove('hold'); if (navigator.vibrate) navigator.vibrate(25); popup(c); }, 450);\n      });\n      el.addEventListener('pointermove', e => { if (t && (Math.abs(e.clientX - x0) > 10 || Math.abs(e.clientY - y0) > 10)) cancel(); });\n      ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => el.addEventListener(ev, cancel));\n      el.addEventListener('contextmenu', e => e.preventDefault());\n      el.addEventListener('click', e => {\n        if (long) { long = false; e.preventDefault(); return; }\n        const st = e.target.closest('.ug-st[data-er]');\n        c.go(st ? +st.dataset.er : undefined);\n      });\n    });\n  }\n  return { render, popup };\n})();\n<\/script>\n<script>// ===== T60 RAZEM — nakładka TOP5 / TOP7 =====\n(function () {\n  lsSet(LS_AUTOBK, '0');                       // autokopię robi RAZEM (format Pikoff)\n  const $t = () => document.getElementById('toast');\n\n  function sync() {\n    added.length = 0;\n    const s = lsGet(LS_ADDED, '');\n    if (/^(\\d{3})*$/.test(s)) for (let i = 0; i < s.length; i += 3) added.push(s.substr(i, 3));\n    recompute(); render();\n  }\n  function add(c) { $t().innerHTML = ''; addCode(c); return $t().innerHTML; }\n  function undo1() { window.__t60auto = true; try { undo(); } finally { window.__t60auto = false; } }\n\n  // NASTĘPNY WIERSZ — ta sama logika co renderGra tej apki (1 linia na model)\n  function lines() {\n    const NX = codes.length + 1;\n    const items = results.map(({ model: m, res, live }) => {\n      const p = res.pending;\n      if (p && p.betIn === 1)\n        return { id: m.id, p: 1, key: 'NEXT_BET', k: p.k, stake: STAWKI[p.k], txt: `▼ GRA ${m.betLabel} · K${p.k} · ${STAWKI[p.k]} zł`, sub: `trigger Nr ${p.trigI + 1} (+${m.off})` };\n      if (p)\n        return { id: m.id, p: 4, key: 'TRIG_PEND', txt: `gra za ${p.betIn} → Nr ${p.trigI + m.off + 1} · K${p.k}`, sub: `trigger Nr ${p.trigI + 1}` };\n      if (res.state === 'open')\n        return { id: m.id, p: 3, key: 'czek', txt: `trigger jeśli wpadnie ${m.trigLabel}`, sub: `→ gra na Nr ${NX + m.off} · K${res.nextK}` };\n      if (live.type === 'COUNTING')\n        return { id: m.id, p: 6, key: 'wait', txt: `brak · HIT ${live.hits}/${m.min}`, sub: m.stepLabel };\n      return { id: m.id, p: 6, key: 'wait', txt: 'brak · czeka na STEP', sub: `${m.min}× ${m.stepLabel}` };\n    });\n    const openM = results.filter(x => x.res.state === 'open');\n    const trig = CODES16.map(c => [c, openM.filter(x => match(c, x.model.trig)).map(x => x.model.id)]).filter(x => x[1].length);\n    return { sections: [{ name: '', items }], trig };\n  }\n\n  // ===== TABELA w układzie wspólnym (UT) — etykiety 1:1 z rowView / playPlan =====\n  const css = k => sty(k);\n  const A = {\n    N: () => codes.length, code: i => codes[i], isNew: i => i >= SEED_N,\n    models: () => MODELS.map(m => ({ id: m.id })),\n    desc: mi => { const m = MODELS[mi]; return esc(`${m.id}: ${m.min}× ${m.stepLabel} → trigger ${m.trigLabel} → BET ${m.betLabel} na +${m.off} · K8`); },\n    descTxt: mi => { const m = MODELS[mi]; return `${m.min}× ${m.stepLabel} → trigger ${m.trigLabel} → BET ${m.betLabel} na +${m.off} · K8`; },\n    last: mi => { const r = results[mi]; return r.res.pending ? r.res.pending.trigI + r.model.off : codes.length - 1; },\n    cell: (mi, i) => {\n      const P = getPlans(), m = MODELS[mi], res = results[mi].res, pe = P[mi].get(i), out = { det: [] };\n      if (pe) {\n        out.gra = { t: pe.t, css: css(pe.st) };\n        out.det.push(['Trigger', `Nr ${pe.trigI + 1} (+${m.off})`], ['Zakład', `Nr ${pe.betI + 1} · K${pe.k} · ${STAWKI[pe.k]} zł`]);\n      }\n      if (i < codes.length) {\n        const v = rowView(m, res.rows[i]);\n        out.stan = { t: v.rola, css: css(v.styleKey), sub: [v.num, v.para, v.krok].filter(x => x != null && x !== '').join(' · ') };\n        if (v.num != null) out.det.push(['#', v.num]);\n        if (v.para != null) out.det.push(['Para', v.para]);\n        if (v.krok != null) out.det.push(['Krok', v.krok]);\n      }\n      return out;\n    },\n    ev: (mi, i) => { const c = A.cell(mi, i); return !!c.gra || (c.stan && !/^(wait|STEP skip)$/.test(c.stan.t)); },\n    tag: (mi, i) => {\n      const P = getPlans(), pe = P[mi].get(i);\n      if (i >= codes.length) return pe ? { t: pe.tag, css: css(pe.st) } : null;\n      const s = shortTag(results[mi].res.rows[i], pe); return { t: s.tag, css: css(s.st) };\n    },\n    chip: (mi, i) => {\n      const p = getPlans()[mi].get(i);\n      if (!p || !(p.st === 'NEXT_BET' || p.st === 'TRIG_PEND' || p.st === 'BET_WIN' || p.st === 'BET_LOSS')) return null;\n      return { css: css(p.st), t: p.st === 'TRIG_PEND' ? `▶ gra Nr ${p.betI + 1}` : p.st === 'NEXT_BET' ? (p.betI === i ? `GRA K${p.k} ${STAWKI[p.k]} zł` : `▼ nast. GRA K${p.k}`) : `${p.tag === 'W' ? 'WIN' : 'LOSS'} K${p.k}` };\n    },\n    legend: () => `Kolumna <b>GRA<\/b>: <span style=\"${css('TRIG_PEND')}\">▶ TRIGGER → start gry<\/span><span style=\"${css('czek')}\">start gry za n<\/span><span style=\"${css('NEXT_BET')}\">▼ następny wiersz = GRA<\/span><span style=\"${css('BET_WIN')}\">WIN<\/span><span style=\"${css('BET_LOSS')}\">LOSS<\/span>\n      <br><b>Stan/Rola<\/b>: <span style=\"${css('HIT')}\">HIT n<\/span><span style=\"${css('OPEN')}\">STEP OPEN<\/span><span style=\"${css('skip')}\">skip<\/span><span style=\"${css('RESET')}\">RESET<\/span><span style=\"${css('czek')}\">czekamy (off)<\/span><span style=\"${css('TRIG_WIN')}\">TRIGGER → WIN<\/span><span style=\"${css('TRIG_LOSS')}\">TRIGGER → LOSS<\/span><span style=\"${css('BET_WIN')}\">BET WIN<\/span><span style=\"${css('BET_LOSS')}\">BET LOSS<\/span>\n      <br>WSZ: T trigger · liczba = za ile wierszy · ▼ następny = gra · W/L wynik · H1 HIT · OP STEP OPEN · s skip · R RESET · · wait. Wiersze przerywane = przyszłe kody gry w toku.`,\n    bottomH: () => document.querySelector('nav').offsetHeight,\n  };\n  UT.A = A;\n  renderTab = function () { UT.render($main, A); };\n\n  // TAPNIĘCIE → TABELA modelu, wiersz którego dotyczy stan: gra w toku → TRIGGER, inaczej ostatni\n  function goModel(id) {\n    const mi = MODELS.findIndex(m => m.id === id);\n    if (mi < 0) return;\n    const r = results[mi].res;\n    UT.open(id, r.pending ? r.pending.trigI : null);\n    view = 'tab'; render();\n  }\n  // ===== GRA w układzie wspólnym (UG, wzór PIKOFF) =====\n  let STr = null, ST = null;\n  const stat = mi => { if (STr !== results) { STr = results; ST = results.map(x => computeStats(codes, x.res, x.model)); } return ST[mi]; };\n  const zl = v => `${v >= 0 ? '+' : '−'}${Math.abs(v).toLocaleString('pl-PL')} zł`;\n  function cards(goFn) {\n    const L = lines().sections[0].items;\n    return [{ name: '', cards: results.map((x, mi) => {\n      const m = x.model, l = L[mi], st = stat(mi);\n      return { id: m.id, rule: `${m.min}× ${m.stepLabel} → ${m.trigLabel} · +${m.off}`,\n        lines: [{ p: l.p, txt: l.txt, sub: l.sub, stake: l.stake }],\n        meta: [`trig ${st.trig} · WIN ${st.win} · WR ${st.wr}% · busty ${st.busty}`, zl(st.bilans)],\n        go: er => goFn(m.id, er) };\n    }) }];\n  }\n  const _rg = renderGra;\n  renderGra = function () {\n    _rg();   // podpowiedź „TRIGGER da” pod polem\n    UG.render($main, { N: codes.length, sections: cards(id => goModel(id)), last: codes.slice(-8), idleSub: 'Żaden model nie gra na następnym wierszu.' });\n  };\n\n  window.T60 = {\n    count: () => codes.length, last: () => codes[codes.length - 1], seedN: SEED_N,\n    sync, add, undo: undo1, lines, cards, go: goModel, render,\n    selfTest: () => { const e = selfTest(seedArr.slice(0, TABLE.nCodesRef)); return { ok: !e.length, txt: e.length ? e.join('; ') : `${TABLE.nCodesRef} kodów: ${MODELS.length} modeli = EXPECTED` }; },\n  };\n  render();\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"k": "top7", "short": "TOP7", "name": "TOP7 · BET x1x · K8", "ver": "1.4.0", "store": "added", "key": "top7_v1_added", "extra": [["top7_v1_autobk", "0"]], "seedN": 12829, "html": "<!DOCTYPE html>\n<html lang=\"pl\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no\">\n<meta name=\"theme-color\" content=\"#1b1f2a\">\n<meta name=\"mobile-web-app-capable\" content=\"yes\">\n<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n<title>TOP7 x1x<\/title>\n<style>\n:root{--bg:#12151c;--pan:#1b1f2a;--pan2:#242a38;--ln:#323a4d;--tx:#e8ebf2;--mu:#8b93a7;--acc:#ff6600;--pur:#7030a0;--ok:#00b050;--bad:#c00000}\n*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}\nhtml,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}\nheader{position:sticky;top:0;z-index:5;background:var(--pan);border-bottom:1px solid var(--ln);padding:8px 12px;display:flex;align-items:center;gap:8px}\nheader h1{font-size:16px;margin:0;flex:1}\nheader .n{color:var(--mu);font-size:12px}\nnav{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;background:var(--pan);border-top:1px solid var(--ln)}\nnav button{flex:1;background:none;border:0;color:var(--mu);padding:10px 0 12px;font-size:13px;font-weight:600}\nnav button.on{color:var(--acc)}\nmain{padding:10px 10px 80px;max-width:720px;margin:0 auto}\n.card{background:var(--pan);border:1px solid var(--ln);border-radius:10px;padding:10px;margin-bottom:10px}\n.banner{border-radius:10px;padding:10px 12px;margin-bottom: \"main\"><\/main>\n<div class=\"toast\" id=\"toast\"><\/div>\n<nav>\n  <button data-v=\"gra\" class=\"on\">GRA<\/button>\n  <button data-v=\"tab\">TABELA<\/button>\n  <button data-v=\"stat\">STATY<\/button>\n  <button data-v=\"dane\">DANE<\/button>\n<\/nav>\n<input type=\"file\" id=\"fileIn\" accept=\".json,application/json\">\n<script>\n\"use strict\";\n// =====================================================================\n// SILNIK — engine_top7.js (port 1:1 z hitbet_rules.py, zero-diff)\n// =====================================================================\n// =====================================================================\n// engine_top7.js — silnik tabeli Test60_TOP7_dowolny_hit_BET_x1x.xlsx\n// TOP7 — dowolny hit, BET x1x · K8 · kurs 3,0 · 7 modeli\n//\n// Samodzielny moduł ES (bez zależności). Zawiera:\n//   TABLE, MODELS        — konfiguracja tabeli (z arkusza ZESTAWIENIE)\n//   EXPECTED             — statystyki referencyjne do selfTest()\n//   runModel / runAll    — maszyna stanów (etykiety wierszy, zakłady, progresja)\n//   rowView / STYLES     — tekst i kolory kolumn D-G jak w Excelu\n//   liveStatus           — co teraz grać (START GRY / NASTĘPNY KOD = BET / ...)\n//   computeStats / panelText — panel statystyk i ZESTAWIENIE\n//   normalizeCode        — walidacja wpisu użytkownika (\"10\" → \"010\")\n//\n// Źródło prawdy: hitbet_rules.py (Python, pipeline Excel init/dopisz).\n// Zwalidowano: 0 różnic etykiet D-G i statystyk deterministycznych\n// wobec pliku referencyjnego (12809 kodów).\n// EXPECTED po korekcie kodu Nr 12572: 110 → 310.\n// =====================================================================\n\nconst TABLE = {\n  key: 'top7',\n  file: 'Test60_TOP7_dowolny_hit_BET_x1x.xlsx',\n  title: 'TOP7 — dowolny hit, BET x1x',\n  nCodesRef: 12809,\n  sourceSheet: \"M1 3x 001∪010∪200 off4\",   // kody wpisywane tylko tu (kol. C)\n};\n\nconst RAW_MODELS = [\n  {\"id\": \"M1\", \"sheet\": \"M1 3x 001∪010∪200 off4\", \"stepLabel\": \"001∪010∪200\", \"min\": 3, \"trigLabel\": \"000∪201\", \"off\": 4, \"betLabel\": \"x1x\"},\n  {\"id\": \"M2\", \"sheet\": \"M2 2x 001∪110∪310 off3\", \"stepLabel\": \"001∪110∪310\", \"min\": 2, \"trigLabel\": \"100∪301\", \"off\": 3, \"betLabel\": \"x1x\"},\n  {\"id\": \"M3\", \"sheet\": \"M3 3x 001∪010∪200 off4\", \"stepLabel\": \"001∪010∪200\", \"min\": 3, \"trigLabel\": \"000∪101\", \"off\": 4, \"betLabel\": \"x1x\"},\n  {\"id\": \"M4\", \"sheet\": \"M4 2x 001∪110∪300 off3\", \"stepLabel\": \"001∪110∪300\", \"min\": 2, \"trigLabel\": \"100∪301\", \"off\": 3, \"betLabel\": \"x1x\"},\n  {\"id\": \"M5\", \"sheet\": \"M5 6x xx0 off6\", \"stepLabel\": \"xx0\", \"min\": 6, \"trigLabel\": \"011∪100\", \"off\": 6, \"betLabel\": \"x1x\"},\n  {\"id\": \"M6\", \"sheet\": \"M6 4x 000∪010∪300 off8\", \"stepLabel\": \"000∪010∪300\", \"min\": 4, \"trigLabel\": \"001∪011\", \"off\": 8, \"betLabel\": \"x1x\"},\n  {\"id\": \"M7\", \"sheet\": \"M7 5x 000∪001∪100 off3\", \"stepLabel\": \"000∪001∪100\", \"min\": 5, \"trigLabel\": \"100∪101\", \"off\": 3, \"betLabel\": \"x1x\"}\n];\n\nconst EXPECTED = {\n  M1: {\"trig\": 282, \"win\": 118, \"wr\": 41.8, \"base\": 28.5, \"cykle\": 118, \"maxloss\": 7, \"busty\": 0, \"bilans\": 4096, \"wf\": 5, \"is\": 2888, \"oos\": 1160, \"wrIs\": 42, \"wrOos\": 41.6},\n  M2: {\"trig\": 267, \"win\": 101, \"wr\": 37.8, \"base\": 28.5, \"cykle\": 101, \"maxloss\": 7, \"busty\": 0, \"bilans\": 3808, \"wf\": 5, \"is\": 2232, \"oos\": 1576, \"wrIs\": 37.5, \"wrOos\": 38.3},\n  M3: {\"trig\": 284, \"win\": 105, \"wr\": 37, \"base\": 28.5, \"cykle\": 105, \"maxloss\": 7, \"busty\": 0, \"bilans\": 4616, \"wf\": 5, \"is\": 3240, \"oos\": 1320, \"wrIs\": 34.1, \"wrOos\": 41.2},\n  M4: {\"trig\": 280, \"win\": 102, \"wr\": 36.4, \"base\": 28.5, \"cykle\": 102, \"maxloss\": 7, \"busty\": 0, \"bilans\": 4896, \"wf\": 5, \"is\": 2944, \"oos\": 1928, \"wrIs\": 35.7, \"wrOos\": 37.5},\n  M5: {\"trig\": 345, \"win\": 125, \"wr\": 36.2, \"base\": 28.5, \"cykle\": 125, \"maxloss\": 7, \"busty\": 0, \"bilans\": 5032, \"wf\": 5, \"is\": 2784, \"oos\": 2256, \"wrIs\": 37.2, \"wrOos\": 34.8},\n  M6: {\"trig\": 304, \"win\": 110, \"wr\": 36.2, \"base\": 28.5, \"cykle\": 110, \"maxloss\": 7, \"busty\": 0, \"bilans\": 4488, \"wf\": 5, \"is\": 2640, \"oos\": 1832, \"wrIs\": 35.7, \"wrOos\": 36.9},\n  M7: {\"trig\": 295, \"win\": 106, \"wr\": 35.9, \"base\": 28.5, \"cykle\": 106, \"maxloss\": 7, \"busty\": 0, \"bilans\": 5448, \"wf\": 5, \"is\": 3752, \"oos\": 1696, \"wrIs\": 34.5, \"wrOos\": 38.1}\n};\n\n// =====================================================================\n// SILNIK (wspólny dla rodziny tabel \"STEP n× → hit → BET x1x na +off\")\n// Port 1:1 z hitbet_rules.py (Python) — zwalidowany na pliku referencyjnym.\n// Bez zależności, ES module, działa w przeglądarce i w Node.\n// =====================================================================\n\nconst K_LIMIT = 8;\n/** Zysk netto przy WIN na kroku k (kurs 3,0). */\nconst PNL_WIN = { 1: 16, 2: 8, 3: 16, 4: 32, 5: 64, 6: 128, 7: 256, 8: 512 };\n/** Strata przy LOSS na K8 (bust = suma stawek K1..K8). */\nconst PNL_BUST = -1024;\n/** Stawka na kroku k. */\nconst STAWKI = { 1: 8, 2: 8, 3: 16, 4: 32, 5: 64, 6: 128, 7: 256, 8: 512 };\n\nconst IS_FRACTION = 0.6;\nconst WF_PARTS = 5;\nconst MC_SEED = 42;\nconst BOOT_ITER = 5000;\nconst PERM_ITER = 5000;\n\n// ---------------------------------------------------------------------\n// KODY\n// ---------------------------------------------------------------------\n\n/** Normalizacja wpisu użytkownika / komórki → \"010\" albo null. */\nfunction normalizeCode(v) {\n  if (v === null || v === undefined) return null;\n  const s = String(v).trim();\n  if (s === '') return null;\n  if (!/^\\d{1,3}(\\.0+)?$/.test(s)) return null;      // tylko cyfry (Excel: 10.0)\n  return String(parseInt(s, 10)).padStart(3, '0');\n}\n\n/** \"001∪010∪200\" / \"xx0\" → [\"001\",\"010\",\"200\"] / [\"xx0\"]. */\nfunction parseSet(label) {\n  return String(label).split('∪').map(t => t.trim()).filter(Boolean);\n}\n\n/** Czy kod pasuje do któregoś tokenu ('x' = dowolna cyfra). */\nfunction match(code, tokens) {\n  if (!code) return false;\n  for (const t of tokens) {\n    if (t.length !== 3) continue;\n    let ok = true;\n    for (let i = 0; i < 3; i++) {\n      if (t[i] !== 'x' && t[i] !== code[i]) { ok = false; break; }\n    }\n    if (ok) return true;\n  }\n  return false;\n}\n\nfunction prepModel(m) {\n  return {\n    ...m,\n    steps: parseSet(m.stepLabel),\n    trig: parseSet(m.trigLabel),\n    bet: parseSet(m.betLabel),\n  };\n}\n\nconst MODELS = RAW_MODELS.map(prepModel);\n\n// ---------------------------------------------------------------------\n// MASZYNA STANÓW — przeliczenie całego ciągu dla jednego modelu\n// ---------------------------------------------------------------------\n/**\n * wait : kod ∈ STEP → HIT n (licznik); przy n = min → STEP OPEN.\n *        kod ∉ STEP: licznik>0 → RESET, licznik=0 → wait.\n * open : kod ∈ TRIGGER → TRIGGER; kod ∈ STEP → \"STEP OPEN\" (etykieta);\n *        reszta → STEP skip.\n * off  : (off-1) × czekamy, kod na pozycji trigger+off = BET\n *        (∈ BET → WIN, inaczej LOSS), potem wait. Kod BET nie liczy się jako HIT.\n * Wiersz TRIGGER dostaje wynik swojego BET (lookahead).\n *\n * @returns {{rows, bets, pending, nextK, state, hitCount}}\n *   rows[i]: {role:'wait'|'HIT'|'RESET'|'OPEN'|'skip'|'TRIG'|'czek'|'BET',\n *             n?, num?, win?, krok?, pending?, betIn?, isLast?, off?}\n *   bets[j]: {trigI, betI, win, k}   (indeksy 0-based)\n *   pending: null | {trigI, k, betIn}  betIn = ile kodów do BET (1 = następny)\n */\nfunction runModel(codes, model) {\n  const { steps, trig, bet, min, off } = model;\n  const rows = [];\n  const bets = [];\n  let st = 'wait', cnt = 0, left = 0, trigI = null;\n\n  for (let i = 0; i < codes.length; i++) {\n    const c = codes[i];\n    if (st === 'wait') {\n      if (match(c, steps)) {\n        cnt += 1;\n        if (cnt >= min) { rows.push({ role: 'OPEN' }); st = 'open'; cnt = 0; }\n        else rows.push({ role: 'HIT', n: cnt });\n      } else {\n        rows.push({ role: cnt > 0 ? 'RESET' : 'wait' }); cnt = 0;\n      }\n    } else if (st === 'open') {\n      if (match(c, trig)) {\n        rows.push({ role: 'TRIG' }); st = 'off'; trigI = i; left = off - 1;\n      } else {\n        rows.push({ role: match(c, steps) ? 'OPEN' : 'skip' });\n      }\n    } else { // off\n      if (left > 0) { rows.push({ role: 'czek', trigI }); left -= 1; }\n      else {\n        const w = match(c, bet);\n        rows.push({ role: 'BET', win: w, trigI });\n        bets.push({ trigI, betI: i, win: w, k: null });\n        st = 'wait';\n      }\n    }\n  }\n\n  // progresja K8 + numeracja WIN/LOSS (osobne liczniki)\n  let k = 1, nw = 0, nl = 0;\n  for (const b of bets) {\n    b.k = k;\n    const num = b.win ? ++nw : ++nl;\n    for (const idx of [b.trigI, b.betI]) { rows[idx].num = num; rows[idx].win = b.win; }\n    rows[b.betI].krok = k;\n    if (b.win || k === K_LIMIT) k = 1; else k += 1;\n  }\n\n  let pending = null;\n  if (st === 'off') {\n    pending = { trigI, k, betIn: left + 1 };\n    Object.assign(rows[trigI], { pending: true, krok: k, betIn: off, off,\n                                 isLast: trigI === rows.length - 1 });\n    for (let j = trigI + 1; j < rows.length; j++) {\n      Object.assign(rows[j], { pending: true, betIn: trigI + off - j, krok: k });\n    }\n  }\n  return { rows, bets, pending, nextK: k, state: st, hitCount: cnt };\n}\n\n// ---------------------------------------------------------------------\n// ETYKIETY + KOLORY (identyczne z tabelą Excel)\n// ---------------------------------------------------------------------\n/** styleKey → {fill, font, bold}  (kolory ARGB bez kanału alfa: \"#RRGGBB\"). */\nconst STYLES = {\n  wait:      { fill: '#FFFFFF', font: '#888888', bold: false },\n  HIT:       { fill: '#FFF2CC', font: '#7F6000', bold: false },   // HIT1\n  HIT2:      { fill: '#FFE699', font: '#7F6000', bold: false },\n  HIT3:      { fill: '#FFD966', font: '#7F6000', bold: false },\n  HIT4:      { fill: '#FFC000', font: '#7F6000', bold: false },   // HIT4+\n  OPEN:      { fill: '#ED7D31', font: '#FFFFFF', bold: true },\n  skip:      { fill: '#F2F2F2', font: '#7F7F7F', bold: false },\n  RESET:     { fill: '#E7E6E6', font: '#C00000', bold: false },\n  czek:      { fill: '#DEEBF7', font: '#2E75B6', bold: false },\n  TRIG_WIN:  { fill: '#92D050', font: '#003300', bold: true },\n  TRIG_LOSS: { fill: '#FFC7CE', font: '#9C0006', bold: true },\n  BET_WIN:   { fill: '#00B050', font: '#FFFFFF', bold: true },\n  BET_LOSS:  { fill: '#C00000', font: '#FFFFFF', bold: true },\n  TRIG_PEND: { fill: '#7030A0', font: '#FFFFFF', bold: true },   // ▶ START GRY (w toku)\n  NEXT_BET:  { fill: '#FF6600', font: '#FFFFFF', bold: true },   // ⚠ następny kod = BET\n};\n\nfunction krokTxt(k) { return `krok K${k} · stawka ${STAWKI[k]} zł`; }\n\n/**\n * Widok jednego wiersza (to, co Excel ma w kolumnach D, E, F, G).\n * @returns {{styleKey, rola, num, para, krok}}\n */\nfunction rowView(model, r) {\n  const v = (styleKey, rola, num = null, para = null, krok = null) =>\n    ({ styleKey, rola, num, para, krok });\n  switch (r.role) {\n    case 'wait':  return v('wait', 'wait');\n    case 'HIT':   return v(r.n === 1 ? 'HIT' : `HIT${Math.min(r.n, 4)}`, `HIT${r.n}`);\n    case 'RESET': return v('RESET', 'RESET');\n    case 'OPEN':  return v('OPEN', `STEP OPEN (${model.stepLabel})`);\n    case 'skip':  return v('skip', 'STEP skip');\n    case 'czek':\n      if (r.pending) {\n        if (r.betIn === 1)\n          return v('NEXT_BET', `⚠ NASTĘPNY WIERSZ = BET ${model.betLabel} · ${krokTxt(r.krok)}`,\n                   null, 'BET ▼', `K${r.krok}`);\n        return v('czek', `czekamy (off) · BET za ${r.betIn}`);\n      }\n      return v('czek', 'czekamy (off)');\n    case 'TRIG':\n      if (r.pending) {\n        if (r.isLast && r.betIn === 1)\n          return v('NEXT_BET', `▶ START GRY · NASTĘPNY WIERSZ = BET ${model.betLabel} · ${krokTxt(r.krok)}`,\n                   null, 'BET ▼', `K${r.krok}`);\n        return v('TRIG_PEND', `▶ START GRY · TRIGGER → ? · BET na +${r.off} · ${krokTxt(r.krok)}`,\n                 null, 'START', `K${r.krok}`);\n      }\n      return r.win ? v('TRIG_WIN', 'TRIGGER → WIN', `#${r.num}`, 'WIN')\n                   : v('TRIG_LOSS', 'TRIGGER → LOSS', `#${r.num}`, 'LOSS');\n    case 'BET':\n      return r.win ? v('BET_WIN', 'BET · WIN ✓', `#${r.num}`, 'WIN', `K${r.krok}`)\n                   : v('BET_LOSS', 'BET · LOSS ✗', `#${r.num}`, 'LOSS', `K${r.krok}`);\n    default: throw new Error('rola? ' + r.role);\n  }\n}\n\n/**\n * Stan \"na żywo\" modelu — do ekranu głównego aplikacji.\n * type: 'NEXT_BET' | 'PENDING' | 'OPEN' | 'COUNTING' | 'IDLE'\n */\nfunction liveStatus(model, res) {\n  const base = { model: model.id, nextK: res.nextK, stake: STAWKI[res.nextK] };\n  if (res.pending) {\n    const p = res.pending;\n    return { ...base, type: p.betIn === 1 ? 'NEXT_BET' : 'PENDING', betIn: p.betIn,\n             k: p.k, stake: STAWKI[p.k],\n             text: p.betIn === 1\n               ? `${model.id}: NASTĘPNY KOD = BET ${model.betLabel} · ${krokTxt(p.k)}`\n               : `${model.id}: START GRY — BET za ${p.betIn} kodów · ${krokTxt(p.k)}` };\n  }\n  if (res.state === 'open')\n    return { ...base, type: 'OPEN',\n             text: `${model.id}: STEP OPEN — czekam na hit ${model.trigLabel}` };\n  if (res.hitCount > 0)\n    return { ...base, type: 'COUNTING', hits: res.hitCount, need: model.min,\n             text: `${model.id}: HIT ${res.hitCount}/${model.min}` };\n  return { ...base, type: 'IDLE', text: `${model.id}: czekam na STEP` };\n}\n\n// ---------------------------------------------------------------------\n// STATYSTYKI\n// ---------------------------------------------------------------------\nfunction sim(outcomes) {\n  let k = 1, p = 0;\n  for (const w of outcomes) {\n    if (w) { p += PNL_WIN[k]; k = 1; }\n    else if (k === K_LIMIT) { p += PNL_BUST; k = 1; }\n    else k += 1;\n  }\n  return p;\n}\n\n// mulberry32 — deterministyczny PRNG (seed) dla Monte-Carlo\nfunction rng32(seed) {\n  let a = seed >>> 0;\n  return () => {\n    a = (a + 0x6D2B79F5) >>> 0;\n    let t = a;\n    t = Math.imul(t ^ (t >>> 15), t | 1);\n    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);\n    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;\n  };\n}\n\nconst r1 = x => Math.round(x * 10) / 10;\n\n/**\n * Statystyki modelu (panel J arkusza + wiersz ZESTAWIENIA).\n * Deterministyczne: trig, win, wr, base, cykle, busty, maxloss, bilans,\n *   is, oos, wrIs, wrOos, wf  — zgodne 1:1 z tabelą Excel.\n * Monte-Carlo (opts.mc, stały seed): perm, bootMed, bootP0 — przybliżone,\n *   inny generator niż w Pythonie, więc drobne różnice są normalne.\n */\nfunction computeStats(codes, res, model, opts = {}) {\n  const ws = res.bets.map(b => b.win);\n  const n = ws.length;\n  const wins = ws.filter(Boolean).length;\n  const busty = res.bets.filter(b => !b.win && b.k === K_LIMIT).length;\n  let maxloss = 0, cur = 0;\n  for (const w of ws) { cur = w ? 0 : cur + 1; if (cur > maxloss) maxloss = cur; }\n  const baseCnt = codes.filter(c => match(c, model.bet)).length;\n  const base = codes.length ? baseCnt / codes.length * 100 : 0;\n  const cut = Math.floor(n * IS_FRACTION);\n  const isW = ws.slice(0, cut), oosW = ws.slice(cut);\n  let wf = 0;\n  for (let i = 0; i < WF_PARTS; i++) {\n    if (sim(ws.slice(Math.floor(i * n / WF_PARTS), Math.floor((i + 1) * n / WF_PARTS))) > 0) wf++;\n  }\n  const s = {\n    trig: n, win: wins, wr: n ? r1(wins / n * 100) : 0, base: r1(base),\n    cykle: wins + busty, busty, maxloss, bilans: sim(ws),\n    is: sim(isW), oos: sim(oosW),\n    wrIs: cut ? r1(isW.filter(Boolean).length / cut * 100) : 0,\n    wrOos: n - cut ? r1(oosW.filter(Boolean).length / (n - cut) * 100) : 0,\n    wf, perm: null, bootMed: null, bootP0: null,\n  };\n  if (opts.mc && n) {\n    const rnd = rng32(opts.seed ?? MC_SEED);\n    const boot = [];\n    for (let it = 0; it < (opts.bootIter ?? BOOT_ITER); it++) {\n      const smp = new Array(n);\n      for (let j = 0; j < n; j++) smp[j] = ws[Math.floor(rnd() * n)];\n      boot.push(sim(smp));\n    }\n    boot.sort((a, b) => a - b);\n    const L = boot.length;\n    s.bootMed = L % 2 ? boot[(L - 1) / 2] : Math.trunc((boot[L / 2 - 1] + boot[L / 2]) / 2);\n    s.bootP0 = r1(boot.filter(b => b <= 0).length / L * 100);\n    const p = base / 100;\n    let below = 0; const PI = opts.permIter ?? PERM_ITER;\n    for (let it = 0; it < PI; it++) {\n      const smp = new Array(n);\n      for (let j = 0; j < n; j++) smp[j] = rnd() < p;\n      if (sim(smp) < s.bilans) below++;\n    }\n    s.perm = Math.round(below / PI * 100);\n  }\n  return s;\n}\n\n// ---------------------------------------------------------------------\n// API WYSOKIEGO POZIOMU\n// ---------------------------------------------------------------------\n/** Przelicza wszystkie modele tabeli. Pełne przeliczenie ~13k kodów × 7 modeli < 50 ms. */\nfunction runAll(codes, opts = {}) {\n  return MODELS.map(m => {\n    const res = runModel(codes, m);\n    return { model: m, res, live: liveStatus(m, res),\n             stats: opts.stats ? computeStats(codes, res, m, opts) : null };\n  });\n}\n\n/** Wiersz zestawienia jak w arkuszu (tekst panelu J). */\nfunction panelText(s) {\n  const pl = v => (v >= 0 ? '+' : '-') + String(Math.abs(v)).replace(/\\B(?=(\\d{3})+(?!\\d))/g, ' ');\n  return {\n    'Triggery / WIN': `${s.trig} / ${s.win}`,\n    'WR (baseline)': `${s.wr.toFixed(1)}% (${s.base.toFixed(1)}%)`,\n    'Cykle / busty': `${s.cykle} / ${s.busty}`,\n    'max LOSS': s.maxloss,\n    'Bilans K8 @3,0': pl(s.bilans),\n    'Permutacja pctl': s.perm == null ? '—' : String(s.perm),\n    'Bootstrap med / P(≤0)': s.bootMed == null ? '—'\n      : `${s.bootMed >= 0 ? '+' : ''}${s.bootMed} / ${Math.round(s.bootP0)}%`,\n    'Walk-forward': `${s.wf}/${WF_PARTS} lat +`,\n    'IS / OOS': `${s.is >= 0 ? '+' : ''}${s.is} / ${s.oos >= 0 ? '+' : ''}${s.oos}  (WR ${s.wrIs.toFixed(1)}/${s.wrOos.toFixed(1)}%)`,\n  };\n}\n\n/** Test zgodności z tabelą referencyjną (EXPECTED). Zwraca listę rozbieżności. */\nfunction selfTest(codes) {\n  const errs = [];\n  if (codes.length !== TABLE.nCodesRef)\n    errs.push(`liczba kodów ${codes.length} ≠ ${TABLE.nCodesRef} (test tylko dla ciągu referencyjnego)`);\n  for (const m of MODELS) {\n    const s = computeStats(codes, runModel(codes, m), m);\n    const e = EXPECTED[m.id];\n    for (const key of Object.keys(e)) if (s[key] !== e[key]) errs.push(`${m.id}.${key}: ${s[key]} ≠ ${e[key]}`);\n  }\n  return errs;\n}\n\n\n// =====================================================================\n// APLIKACJA\n// =====================================================================\nconst APP_VER = '1.4.0';\nconst LS_ADDED = 'top7_v1_added';      // dopisane kody (ciąg 3-znakowych, bez separatora)\nconst LS_AUTOBK = 'top7_v1_autobk';    // auto-backup co 10 kodów (1/0)\nconst LS_LASTBK = 'top7_v1_lastbk';    // n przy ostatnim backupie\nconst LS_LASTIMP = 'top7_v1_lastimp';  // opis ostatniego importu\nconst JSON_KIND = 'top7';\nconst PIKOFF_KIND = 'xx1_pikoff';      // eksport z apki Pikoff 60 (ten sam ciąg Test60)\nconst ALIGN_TAIL = 40;                 // długość końcówki do dopasowania, gdy numeracja pliku jest inna\nconst SEED = '0010000000102000100010100111000011112010000002000012100002110002100100000112001000010000110110000000000000000101000000000100010011010010001010100010100010000100100010000000000000000100110000100000001100100013000102000000100000011100001000000003000000010010000113000003010101000000000000010000010100000100010010001010000100012100101000010100010010000010100000110012011101012010002110101100010110100000002002000110000000000000110000100012000000100001110000002000000010000100101000103010100010010001000100100102000000000000000000111000000002010003110000101011000000000002011011110000001102110010002001000010003000010010110100002 unction lsGet(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }\nfunction lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }\n\nlet added = [];\n(function load() {\n  const s = lsGet(LS_ADDED, '');\n  if (/^(\\d{3})*$/.test(s)) for (let i = 0; i < s.length; i += 3) added.push(s.substr(i, 3));\n})();\nfunction saveAdded() {\n  if (!lsSet(LS_ADDED, added.join(''))) alert('BŁĄD zapisu pamięci telefonu — zrób eksport JSON!');\n}\ntry { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}\n\nconst CODES16 = [];\nfor (const a of '0123') for (const b of '01') for (const c of '01') CODES16.push(a + b + c);\n\nlet codes = [], results = [], plans = null;\nfunction recompute() {\n  codes = seedArr.concat(added);\n  results = runAll(codes);\n  plans = null;\n}\nfunction getPlans() {\n  if (!plans) plans = results.map(r => playPlan(r.model, r.res));\n  return plans;\n}\n\n// ---------------------------------------------------------------------\n// ETYKIETY GRY — kolumna \"GRA\": po KAŻDYM triggerze (historia + w toku)\n//   wiersz TRIGGER        → ▶ TRIGGER → START GRY na Nr X (+off) · K\n//   wiersze czekania      → start gry za n → Nr X\n//   wiersz przed BET      → ▼ NASTĘPNY WIERSZ = GRA x1x · K · stawka\n//   wiersz BET            → GRA x1x · K → WIN ✓ / LOSS ✗   (w toku: GRA x1x · K · stawka)\n// Krok K = progresja K8 modelu (ta sama co kolumna G w Excelu).\n// Indeksy ≥ N (przyszłe) = wiersze-duchy dla gry w toku.\n// ---------------------------------------------------------------------\nfunction playPlan(model, res) {\n  const plan = new Map();\n  const bl = model.betLabel, off = model.off;\n  const add = (trigI, betI, k, win, pending) => {\n    const stake = STAWKI[k];\n    for (let j = trigI; j <= betI; j++) {\n      let t, st, tag;\n      if (j === betI) {\n        if (pending) { t = `GRA ${bl} · K${k} · ${stake} zł`; st = 'NEXT_BE ghost ? 'ghost' : ''}\"><td class=\"nr\">${i + 1}<\/td><td class=\"c\">${ghost ? (i === N ? 'nast.' : '…') : codes[i]}<\/td>${cells}<\/tr>${gra.length ? `<tr class=\"grarow${ghost ? ' ghost' : ''}\"><td><\/td><td colspan=\"${MODELS.length + 1}\">${gra.join('')}<\/td><\/tr>` : ''}`;\n    }\n    h += `<\/tbody><\/table><\/div>`;\n  } else {\n    const mi = MODELS.findIndex(m => m.id === tabSel);\n    const m = MODELS[mi], res = results[mi].res, p = P[mi];\n    h += `<div class=\"muted\" style=\"margin-bottom:6px\">${m.id}: ${m.min}× ${m.stepLabel} → trigger ${m.trigLabel} → BET ${m.betLabel} na +${m.off} · K8<\/div>`;\n    const last = res.pending ? res.pending.trigI + m.off : N - 1;\n    h += `<div class=\"tw\" id=\"tw\"><table><thead><tr><th>Nr<\/th><th>Kod<\/th><th>GRA<\/th><th>Stan/Rola<\/th><th>#<\/th><th>Para<\/th><th>Krok<\/th><\/tr><\/thead><tbody>`;\n    for (let i = from; i <= last; i++) {\n      const pe = p.get(i);\n      const graTd = pe ? `<td class=\"gra\" style=\"${sty(pe.st)}\">${esc(pe.t)}<\/td>` : '<td class=\"gra\"><\/td>';\n      if (i >= N) {\n        h += `<tr class=\"ghost\"><td class=\"nr\">${i + 1}<\/td><td class=\"c\">${i === N ? 'nast.' : '…'}<\/td>${graTd}<td colspan=\"4\" class=\"muted\">${i === N ? 'następny kod' : 'przyszły kod'}<\/td><\/tr>`;\n        continue;\n      }\n      const v = rowView(m, res.rows[i]);\n      h += `<tr><td class=\"nr\">${i + 1}<\/td><td class=\"c\">${codes[i]}<\/td>${graTd}<td class=\"rola\" style=\"${sty(v.styleKey)}\">${esc(v.rola)}<\/td><td>${v.num ?? ''}<\/td><td>${v.para ?? ''}<\/td><td>${v.krok ?? ''}<\/td><\/tr>`;\n    }\n    h += `<\/tbody><\/table><\/div>`;\n  }\n  h += `  <div class=\"legend\">Kolumna <b>GRA<\/b>:\n  <span style=\"${sty('TRIG_PEND')}\">T ▶ TRIGGER → start gry<\/span>\n  <span style=\"${sty('czek')}\">3 2 … za ile wierszy<\/span>\n  <span style=\"${sty('NEXT_BET')}\">▼ następny wiersz = GRA<\/span>\n  <span style=\"${sty('BET_WIN')}\">W<\/span><span style=\"${sty('BET_LOSS')}\">L<\/span> wynik gry.\n  Pozostałe: <span style=\"${sty('HIT')}\">H1<\/span> HIT n · <span style=\"${sty('OPEN')}\">OP<\/span> STEP OPEN · <span style=\"${sty('skip')}\">s<\/span> skip · <span style=\"${sty('RESET')}\">R<\/span> RESET · · wait.\n  Wiersze przerywane = przyszłe kody gry w toku.<\/div>`;\n  $main.innerHTML = h;\n  $main.querySelectorAll('.chips button').forEach(b => b.onclick = () => { tabSel = b.dataset.m; tabLimit = 80; tabScroll = 'end'; render(); });\n  const mb = document.getElementById('more');\n  if (mb) mb.onclick = () => { tabLimit += 200; tabScroll = document.documentElement.scrollHeight - window.scrollY; render(); };\n  const tw = document.getElementById('tw');\n  requestAnimationFrame(() => {\n    if (tabScroll === 'end') {                       // ostatni wiersz (z przyszłymi wierszami gry) nad dolnym paskiem\n      const last = tw.querySelector('tbody tr:last-child');\n      const navH = document.querySelector('nav').offsetHeight;\n      const y = last.getBoundingClientRect().bottom + window.scrollY - (window.innerHeight - navH) + 12;\n      window.scrollTo(0, Math.max(0, y));\n    } else if (typeof tabScroll === 'number') {       // po „wcześniejsze wiersze” zostań w tym samym miejscu\n      window.scrollTo(0, document.documentElement.scrollHeight - tabScroll);\n    }\n    tabScroll = null;\n  });\n}\n\nfunction renderStat() {\n  const stats = results.map(x => computeStats(codes, x.res, x.model, statMC ? { mc: true } : {}));\n  let h = `<div class=\"card\"><h2>Zestawienie — ${fmtN(codes.length)} kodów<\/h2><div class=\"tw\"><table><thead><tr><th>Model<\/th><th>Trig/WIN<\/th><th>WR%<\/th><th>maxL<\/th><th>Busty<\/th><th>Bilans<\/th><th>WF<\/th><\/tr><\/thead><tbody>`;\n  stats.forEach((s, i) => { h += `<tr><td><b>${MODELS[i].id}<\/b><\/td><td>${s.trig}/${s.win}<\/td><td>${s.wr.toFixed(1)}<\/td><td>${s.maxloss}<\/td><td>${s.busty}<\/td><td style=\"color:${s.bilans >= 0 ? '#5fd38a' : '#ff8a8a'}\">${s.bilans >= 0 ? '+' : ''}${fmtN(s.bilans)}<\/td><td>${s.wf}/5<\/td><\/tr>`; });\n  const tot = stats.reduce((a, s) => a + s.bilans, 0);\n  h += `<tr><td><b>Σ<\/b><\/td><td colspan=\"4\"><\/td><td><b>${tot >= 0 ? '+' : ''}${fmtN(tot)}<\/b><\/td><td><\/td><\/tr><\/tbody><\/table><\/div>\n  <div class=\"row\"><button class=\"btn\" id=\"mc\">${statMC ? 'Ukryj Monte-Carlo' : 'Policz Monte-Carlo (bootstrap/permutacja)'}<\/button><\/div><\/div>`;\n  stats.forEach((s, i) => {\n    const m = MODELS[i], pt = panelText(s);\n    h += `<div class=\"card\"><h2>${m.id} · ${m.min}× ${m.stepLabel} → ${m.trigLabel} → x1x +${m.off}<\/h2><table class=\"stt\"><tbody>${Object.entries(pt).map(([k, v]) => `<tr><td>${k}<\/td><td>${esc(v)}<\/td><\/tr>`).join('')}<\/tbody><\/table><\/div>`;\n  });\n  $main.innerHTML = h;\n  document.getElementById('mc').onclick = () => { statMC = !statMC; render(); };\n}\n\nfunction renderDane() {\n  const auto = lsGet(LS_AUTOBK, '1') === '1';\n  $main.innerHTML = `<div class=\"card\"><h2>Dane<\/h2>\n  <table class=\"stt\"><tbody>\n  <tr><td>Kody razem<\/td><td><b>${fmtN(codes.length)}<\/b><\/td><\/tr>\n  <tr><td>w tym z pliku (seed)<\/td><td>${fmtN(SEED_N)}<\/td><\/tr>\n  <tr><td>dopisane / zaimportowane<\/td><td><b>${added.length}<\/b><\/td><\/tr>\n  <tr><td>ostatni import<\/td><td>${esc(lsGet(LS_LASTIMP, '—'))}<\/td><\/tr>\n  <tr><td>ostatni backup przy n<\/td><td>${lsGet(LS_LASTBK, '—')}<\/td><\/tr>\n  <tr><td>wersja<\/td><td>${APP_VER}<\/td><\/tr><\/tbody><\/table>\n  <div class=\"row\"><button class=\"btn pik\" id=\"impP\">⬆ Import kodów z Pikoff 60 (.json)<\/button><\/div>\n  <div class=\"row\"><button class=\"btn pri\" id=\"exp\">⬇ Eksport JSON (do Excela)<\/button><\/div>\n  <div class=\"row\"><button class=\"btn\" id=\"imp\">⬆ Import kopii TOP7 (.json)<\/button><\/div>\n  <label class=\"sw\"><input type=\"checkbox\" id=\"auto\" ${auto ? 'checked' : ''}> Auto-backup JSON co 10 kodów<\/label>\n  <div class=\"row\"><button class=\"btn warn\" id=\"rst\">Usuń dopisane kody (wróć do seed)<\/button><\/div>\n  <div class=\"row\"><button class=\"btn\" id=\"self\">Test zgodności silnika<\/button><\/div>\n  <div class=\"muted\" id=\"selfOut\" style=\"margin-top:6px\"><\/div><\/div>\n  <div class=\"card muted\"><b>Pikoff 60:<\/b> w Pikoff zrób eksport kopii (.json, plik <b>xx1_pikoff_*.json<\/b>), tu „Import kodów z Pikoff 60” i wybierz ten plik. Apka sprawdzi, czy początek ciągu się zgadza, i weźmie tylko nowe kody.<br><br>\n  <b>Excel:<\/b> plik JSON z Pobranych → <b>apka_top7_do_excela.bat<\/b> (dopisuje kody do M1 kol. C i od razu uruchamia dopisz_top7 — wszystkie 7 arkuszy + ZESTAWIENIE).<\/div>`;\n  document.getElementById('exp').onclick = () => exportJSON(false);\n  document.getElementById('imp').onclick = () => { impMode = 'kopia'; document.getElementById('fileIn').click(); };\n  document.getElementById('impP').onclick = () => { impMode = 'pikoff'; document.getElementById('fileIn').click(); };\n  document.getElementById('auto').onchange = e => lsSet(LS_AUTOBK, e.target.checked ? '1' : '0');\n  document.getElementById('rst').onclick = () => {\n    if (!added.length) return;\n    if (!confirm(`Usunąć ${added.length} dopisanych kodów? Najpierw zrób eksport JSON!`)) return;\n    if (!confirm('Na pewno? Tego nie da się cofnąć.')) return;\n    added = []; saveAdded(); recompute(); render();\n  };\n  document.getElementById('self').onclick = () => {\n    const out = document.getElementById('selfOut');\n    const errs = selfTest(seedArr.slice(0, TABLE.nCodesRef));\n    out.innerHTML = !errs.length ? `✓ OK — statystyki na ${fmtN(TABLE.nCodesRef)} kodach referencyjnych zgodne z plikiem (7 modeli)` : '✗ ' + errs.map(esc).join('<br>');\n  };\n}\n\nfunction render() {\n  document.getElementById('hdrN').textContent = `n=${fmtN(codes.length)}${added.length ? ` (+${added.length})` : ''}`;\n  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === view));\n  document.getElementById('entry').style.display = view === 'gra' ? '' : 'none';\n  ({ gra: renderGra, tab: renderTab, stat: renderStat, dane: renderDane })[view]();\n}\n\n// ---------------------------------------------------------------------\n// AKCJE\n// ---------------------------------------------------------------------\nlet toastT = null;\nfunction toast(html, ms = 3500) {\n  const t = document.getElementById('toast');\n  t.innerHTML = html; t.classList.add('on');\n  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), ms);\n}\n\nfunction addCode(c) {\n  c = normalizeCode(c); if (!c) return;\n  added.push(c); saveAdded(); recompute();\n  const N = codes.length, i = N - 1, P = getPlans();\n  const msgs = [];\n  results.forEach((x, mi) => {\n    const p = P[mi].get(i);\n    if (!p) return;\n    if (p.betI === i && !p.pending) msgs.push(`<b>${x.model.id}<\/b>: GRA K${p.k} → ${p.tag === 'W' ? '<span style=\"color:#5fd38a\">WIN ✓<\/span>' : '<span style=\"color:#ff8a8a\">LOSS ✗<\/span>'}`);\n    else if (p.trigI === i) msgs.push(`<b>${x.model.id}<\/b>: ▶ TRIGGER → START GRY na Nr ${p.betI + 1} (+${x.model.off}) · K${p.k}`);\n  });\n  const nb = nextBets();\n  if (nb.length) msgs.push(`<b style=\"color:#ff9a4d\">▼ NASTĘPNY KOD = GRA x1x: ${nb.map(b => `${b.id} K${b.k} ${b.stake} zł`).join(', ')}<\/b>`);\n  toast(`Nr ${N}: <b>${c}<\/b>${msgs.length ? '<br>' + msgs.join('<br>') : ''}`, msgs.length ? 5000 : 1500);\n  if (navigator.vibrate) navigator.vibrate(nb.length ? [60, 60, 120] : 25);\n  render();\n  if (lsGet(LS_AUTOBK, '1') === '1' && added.length % 10 === 0) exportJSON(true);\n}\n\nfunction undo() {\n  if (!added.length) { toast('Brak dopisanych kodów do cofnięcia (kody z pliku są chronione).'); return; }\n  const c = added[added.length - 1];\n  if (!confirm(`Cofnąć ostatni kod Nr ${codes.length}: ${c}?`)) return;\n  added.pop(); saveAdded(); recompute(); render();\n  toast(`Cofnięto Nr ${codes.length + 1}: ${c}`);\n}\n\nfunction stamp() {\n  const d = new Date(), p = n => String(n).padStart(2, '0');\n  return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`;\n}\nfunction exportJSON(auto) {\n  const data = { kind: JSON_KIND, app: 'TOP7 x1x', version: APP_VER, table: TABLE.file,\n                 created: new Date().toISOString(), n: codes.length, seed_n: SEED_N, codes };\n  const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });\n  const a = document.createElement('a');\n  a.href = URL.createObjectURL(blob);\n  a.download = `top7_${stamp()}_n${codes.length}.json`;\n  document.body.appendChild(a); a.click(); a.remove();\n  setTimeout(() => URL.revokeObjectURL(a.href), 5000);\n  lsSet(LS_LASTBK, String(codes.length));\n  toast(auto ? `Auto-backup: ${a.download}` : `Zapisano ${a.download}`);\n}\n\n// ---------------------------------------------------------------------\n// IMPORT (TOP5 kopia albo Pikoff 60)\n// Plik: {kind, codes:[...]} albo sama lista kodów. Kody \"10\"/10 → \"010\".\n// Dopasowanie do ciągu apki:\n//   1) ta sama numeracja: kody pliku = kody apki od Nr 1 (standard Pikoff/Test60)\n//   2) inna numeracja: szukam ostatnich ALIGN_TAIL kodów z pliku (seed) w pliku;\n//      tylko jedno dopasowanie + zgodna cała część wspólna → przesunięcie\n// Każda różnica w części wspólnej = STOP, nic nie zmienione.\n// ---------------------------------------------------------------------\nlet impMode = 'kopia';\n\nfunction alignFile(arr) {\n  // zwraca {shift, newCodes, overlap} — shift: Nr w apce = Nr w pliku + shift\n  const n = Math.min(arr.length, SEED_N);\n  let firstDiff = -1;\n  for (let i = 0; i < n; i++) if (arr[i] !== seedArr[i]) { firstDiff = i; break; }\n  if (firstDiff < 0) {\n    if (arr.length <= SEED_N) return { shift: 0, tail: [], overlap: arr.length };\n    return { shift: 0, tail: arr.slice(SEED_N), overlap: SEED_N };\n  }\n  // numeracja inna? szukam końcówki seed w pliku\n  const tail = seedArr.slice(SEED_N - ALIGN_TAIL).join('|');\n  const hits = [];\n  for (let p = 0; p + ALIGN_TAIL <= arr.length; p++) {\n    if (arr[p] !== seedArr[SEED_N - ALIGN_TAIL]) continue;\n    if (arr.slice(p, p + ALIGN_TAIL).join('|') === tail) hits.push(p);\n  }\n  if (hits.length !== 1) {\n    throw new Error(`kody pliku różnią się od ciągu apki na Nr ${firstDiff + 1} (plik ${arr[firstDiff]}, apka ${seedArr[firstDiff]})` +\n      (hits.length > 1 ? ' i końcówka występuje w pliku kilka razy' : ' — nie znalazłem też końcówki ciągu apki w pliku'));\n  }\n  const endInFile = hits[0] + ALIGN_TAIL;            // indeks w pliku = SEED_N w apce\n  const shift = SEED_N - endInFile;\n  const startFile = Math.max(0, -shift);\n  for (let f = startFile; f < endInFile; f++) {\n    if (arr[f] !== seedArr[f + shift])\n      throw new Error(shift ? `numeracja przesunięta o ${shift}: różnica na Nr apki ${f + shift + 1} (plik Nr ${f + 1}: ${arr[f]}, apka ${seedArr[f + shift]})`\n                           : `różnica na Nr ${f + 1}: plik ${arr[f]}, apka ${seedArr[f]}`);\n  }\n  return { shift, tail: arr.slice(endInFile), overlap: endInFile - startFile };\n}\n\nfunction importFile(d, fname) {\n  const raw = Array.isArray(d) ? d : d && d.codes;\n  if (!Array.isArray(raw) || !raw.length) throw new Error('plik nie zawiera listy kodów (pole \"codes\")');\n  const kind = Array.isArray(d) ? '(lista)' : (d.kind || '?');\n  const want = impMode === 'pikoff' ? PIKOFF_KIND : JSON_KIND;\n  if (kind !== want && !confirm(`Plik ma kind=\"${kind}\", oczekiwano \"${want}\". Kontynuować?`)) return;\n  const arr = raw.map(normalizeCode);\n  const bad = arr.findIndex(x => !x);\n  if (bad >= 0) throw new Error(`nieprawidłowy kod na pozycji ${bad + 1}: ${JSON.stringify(raw[bad])}`);\n\n  const al = alignFile(arr);\n  const newAll = al.tail;                              // kody po seed wg pliku\n  // porównanie z obecnie dopisanymi\n  let same = 0;\n  while (same < Math.min(added.length, newAll.length) && added[same] === newAll[same]) same++;\n  const lose = added.length - same;                   // dopisane w apce, których plik nie ma / ma inne\n  const gain = newAll.length - same;\n  if (!gain) { toast(`Import: brak nowych kodów — plik ma ${arr.length} kodów, apka ${codes.length}${lose ? ' (plik starszy, kody z apki zostają)' : ''}.`, 5000); return; }\n\n  let msg = `Import ${impMode === 'pikoff' ? 'z Pikoff 60' : 'kopii TOP7'}: ${fname}\\n` +\n            `Plik: ${arr.length} kodów${al.shift ? ` (numeracja przesunięta o ${al.shift > 0 ? '+' : ''}${al.shift})` : ''}\\n` +\n            `Zgodna część wspólna: ${al.overlap} kodów\\n` +\n            `Apka teraz: ${codes.length} → po imporcie: ${SEED_N + newAll.length}\\n` +\n            `Nowe kody: ${gain}${gain ? ` (Nr ${SEED_N + same + 1}–${SEED_N + newAll.length})` : ''}`;\n  if (lose) msg += `\\n\\n⚠ UWAGA: ${lose} kodów wpisanych w apce (od Nr ${SEED_N + same + 1}) nie zgadza się z plikiem lub go brak — zostaną zastąpione.`;\n  if (!confirm(msg + '\\n\\nOK?')) return;\n  if (lose && !confirm(`Na pewno zastąpić ${lose} kodów z apki?`)) return;\n  added = newAll.slice(); saveAdded(); recompute();\n  lsSet(LS_LASTIMP, `${impMode === 'pikoff' ? 'Pikoff' : 'TOP7'} · ${new Date().toLocaleString('pl-PL')} · n=${codes.length} · +${gain}`);\n  render();\n  const nb = nextBets();\n  toast(`Zaimportowano: +${gain} kodów, teraz n=${codes.length}` +\n        (nb.length ? `<br><b style=\"color:#ff9a4d\">▼ NASTĘPNY KOD = GRA x1x: ${nb.map(b => `${b.id} K${b.k} ${b.stake} zł`).join(', ')}<\/b>` : ''), 6000);\n}\n\ndocument.getElementById('fileIn').onchange = e => {\n  const f = e.target.files[0]; e.target.value = '';\n  if (!f) return;\n  const rd = new FileReader();\n  rd.onload = () => {\n    try { importFile(JSON.parse(rd.result), f.name); }\n    catch (err) { alert('Import przerwany, nic nie zmieniono:\\n' + err.message); }\n  };\n  rd.readAsText(f);\n};\n\nconst $in = document.getElementById('codeIn');\nconst VALID = new Set(CODES16);\nfunction submitCode() {\n  const v = $in.value.trim();\n  if (!v) return;\n  const c = v.length === 3 ?
